function drawLibraryBookshelf(x, y, w, h) {          // Giá sách lớn thư viện ốp tường bằng gỗ gụ
  // Khung gỗ gụ sẫm màu
  ctx.fillStyle = "#4a3020"; rr(ctx, x, y, w, h, 4); ctx.fill();
  ctx.fillStyle = "#342014"; ctx.fillRect(x + 4, y + 4, w - 8, h - 8);
  // 4 tầng sách với gáy sách nhiều màu
  BOOKS.forEach((row, k) => {
    const by = y + 4 + k * 33 + 30;
    // Sách xếp trên kệ
    row.forEach(b => {
      ctx.fillStyle = b.c;
      ctx.fillRect(x + 6 + b.x * ((w - 12) / 92), by - b.h, b.w * ((w - 12) / 92), b.h);
      // Đường kẻ ép kim vàng/bạc trên gáy sách
      ctx.fillStyle = "rgba(255,225,150,.4)";
      ctx.fillRect(x + 6 + b.x * ((w - 12) / 92) + 1, by - b.h + 3, Math.max(1, b.w * ((w - 12) / 92) - 2), 1.5);
    });
    // Đợt gỗ kệ sách
    ctx.fillStyle = "#5c3d28"; ctx.fillRect(x + 2, by, w - 4, 4);
  });
  // Quả địa cầu mini trang trí ở tầng 2
  ctx.fillStyle = "#c59f60"; ctx.fillRect(x + w - 16, y + 54, 8, 2);
  ctx.beginPath(); ctx.arc(x + w - 12, y + 47, 5, 0, 7); ctx.fill();
  ctx.fillStyle = "#4895ef"; ctx.beginPath(); ctx.arc(x + w - 12, y + 47, 4, 0, 7); ctx.fill();
  ctx.fillStyle = "#52b788"; ctx.fillRect(x + w - 14, y + 46, 3, 2);
  // Thang trượt thư viện tựa vào kệ
  ctx.strokeStyle = "#8a5a3c"; ctx.lineWidth = 2; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x + w - 24, y + 10); ctx.lineTo(x + w - 10, y + h - 2);
  ctx.moveTo(x + w - 16, y + 10); ctx.lineTo(x + w - 2, y + h - 2);
  for (let s = 1; s <= 5; s++) {
    const f = s / 6;
    ctx.moveTo(x + w - 24 + f * 14, y + 10 + f * (h - 12));
    ctx.lineTo(x + w - 16 + f * 14, y + 10 + f * (h - 12));
  }
  ctx.stroke();
  // Thanh ray kim loại đồng vàng trên cùng của kệ
  ctx.fillStyle = "#ffd166"; ctx.fillRect(x + 2, y + 10, w - 4, 2);
}

// ---- 🌳 Các đồ trang trí công viên ----
function drawFlowerBed(x, y, w, h, kind) {          // Luống hoa công viên khoe sắc
  ctx.fillStyle = "#4a3220"; rr(ctx, x, y, w, h, 6); ctx.fill();
  ctx.strokeStyle = "#8a6547"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "#b8b2a5";
  for (let px = x + 4; px < x + w - 3; px += 8) {
    ctx.beginPath(); ctx.arc(px, y + 1, 2, 0, 7); ctx.arc(px, y + h - 1, 2, 0, 7); ctx.fill();
  }
  const cols = kind === "tulip" ? ["#ff4d6d", "#ff758f", "#ff8fa3", "#ffd166"]
             : kind === "rose" ? ["#e63946", "#f72585", "#ff70a6", "#ff9770"]
             : kind === "daisy" ? ["#ffffff", "#fffa65", "#ffffff", "#ffd166"]
             : ["#9b5de5", "#c77dff", "#7209b7", "#a0c4ff"];
  for (let r = 0; r < 2; r++) {
    const fy = y + 7 + r * (h - 14);
    for (let c = 0; c < 5; c++) {
      const fx = x + 7 + c * ((w - 14) / 4);
      ctx.fillStyle = "#38b000"; ctx.fillRect(fx - 0.5, fy + 1, 1, 4);
      const fc = cols[(r * 5 + c) % cols.length];
      ctx.fillStyle = fc; ctx.beginPath(); ctx.arc(fx, fy, 2.8, 0, 7); ctx.fill();
      ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(fx, fy, 1, 0, 7); ctx.fill();
    }
  }
}

function drawBicycleRack(x, y) {                    // Giá để xe đạp kim loại và 2 chiếc xe đạp

function drawDuckFamily(cx, cy, t) {                // Đàn vịt mẹ và vịt con bơi lội trên hồ
  for (let k = 0; k < 3; k++) {
    const da = t * .22 - k * .28;
    const dx = cx + Math.cos(da) * 58;
    const dy = cy + Math.sin(da) * 22;
    const sc = k === 0 ? 1 : 0.65;
    const bob = Math.sin(t * 3.5 + k * 1.5) * 1;
    const facing = Math.sin(da) > 0 ? -1 : 1;

    // Vệt rẽ sóng nước
    ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(dx - facing * 4, dy + bob + 2);
    ctx.lineTo(dx - facing * 12, dy + bob - 1);
    ctx.moveTo(dx - facing * 4, dy + bob + 2);
    ctx.lineTo(dx - facing * 12, dy + bob + 5);
    ctx.stroke();

    ctx.save(); ctx.translate(dx, dy + bob); ctx.scale(facing * sc, sc);
    ctx.fillStyle = k === 0 ? "#ffffff" : "#ffe066";
    ctx.beginPath(); ctx.ellipse(0, 0, 6.5, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = k === 0 ? "#e9ecef" : "#ffd166";
    ctx.beginPath(); ctx.ellipse(-1.5, -0.5, 3.5, 2.2, -.2, 0, 7); ctx.fill();
    ctx.fillStyle = k === 0 ? "#ffffff" : "#ffe066";
    ctx.beginPath(); ctx.arc(4.5, -4, 3.2, 0, 7); ctx.fill();
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(5.2, -4.5, 0.8, 0, 7); ctx.fill();
    ctx.fillStyle = "#f4a261";
    ctx.beginPath(); ctx.moveTo(7, -4); ctx.lineTo(10.5, -3.2); ctx.lineTo(7, -2.5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

let lastT = performance.now() / 1000, noteAcc = 0;
function frame() {
  if (Power.on() && performance.now() / 1000 - lastT < 1 / 31) { requestAnimationFrame(frame); return; }   // tiết kiệm pin: 30 FPS
  const t = performance.now() / 1000, dt = Math.min(.05, t - lastT); lastT = t;
  if (portraitPhone()) { requestAnimationFrame(frame); return; }   // cầm dọc: tạm dừng, hiện nhắc xoay ngang
  steer(t);

  // update
  for (const p of players.values()) {
    if (p.lying) { p.walking = false; continue; }
    const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
    if (d > 1.5) {
      const s = Math.min(d, SPEED * dt);
      p.x += dx / d * s; p.y += dy / d * s; p.walking = true; p.up = dy < -Math.abs(dx) * .6;
    } else {
      p.x = p.tx; p.y = p.ty; p.walking = false; p.up = false;
      if (p.bed != null) { p.lying = true; if (p.id === myId) updateUI(); }
    }
  }
  updatePets(dt);
  if (pendingDoor) {
    const m = me();
    const d = pendingDoor;
    if (m && !m.walking && Math.hypot(m.x - d.spot.x, m.y - d.spot.y) < 3) { pendingDoor = false; openMap(); }   // tới lối ra → mở bản đồ
  }

  lightLevel += (target - lightLevel) * Math.min(1, dt * 2.5);

    noteAcc = 0; notes.push({x: RADIO.x + 24 + (Math.random() - .5) * 20, y: RADIO.y - 5, t, s: ["♪", "♫", "♩"][Math.random() * 3 | 0]});
  }

    } else {
      hx = p.x; hy = p.y - AV_TOP + 2;
      label(nameTag(p), p.x, p.y - AV_TOP, p.id === myId ? "#ffd27a" : "#fff");
    }
    if (p.emote && t < p.emote.until) {
      const a = Math.min(1, (t - p.emote.at) * 5);
      ctx.font = `${16 + a * 8}px system-ui`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.globalAlpha = Math.min(1, (p.emote.until - t) * 2);
      ctx.fillText(p.emote.e, hx + 22, hy - 4 - a * 6);
      ctx.globalAlpha = 1;
    }
    if (p.bubble && t < p.bubble.until) bubble(p.bubble.text, hx, hy - 6);
  }
  ctx.restore();

  // vignette khi mình đang ngủ
  const m = me();
  if (m && m.lying && myArea === "sleep") {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const g = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.height * .25, canvas.width / 2, canvas.height / 2, canvas.height * .75);
    g.addColorStop(0, "rgba(0,0,10,0)"); g.addColorStop(1, `rgba(0,0,10,${.45 + Math.sin(t * .8) * .05})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // banner ngủ cùng nhau
  if (joined) {
    const ar = myArea, all = here(), n = all.length;
    const allSleep = n > 0 && all.every(p => p.lying) && (ar !== "sleep" || !room.light);
    if (allSleep) {
      if (togetherSince == null) togetherSince = t;
      $("#together").classList.remove("hidden");
      $("#togetherText").textContent = {
        study: n > 1 ? `📚 Cả ${n} người đang học cùng nhau` : "📚 Đang tập trung học",
        park: n > 1 ? `🌳 Cả ${n} người đang ngồi ngắm trời cùng nhau` : "🌳 Đang ngồi thư giãn",
        cinema: n > 1 ? `🍿 Cả ${n} người đang xem phim cùng nhau` : "🍿 Đang xem phim",
        sleep: n > 1 ? `🌙 Cả ${n} người đang ngủ cùng nhau` : "🌙 Đang ngủ ngon",
        fishing: n > 1 ? `🎣 Cả ${n} người đang câu cá cùng nhau` : "🎣 Đang ngồi câu cá",
        farm: n > 1 ? `🌾 Cả ${n} người đang nghỉ ở nông trại` : "🌾 Đang nghỉ chân ở nông trại",
        mall: n > 1 ? `🛍️ Cả ${n} người đang nghỉ chân ở khu mua sắm` : "🛍️ Đang nghỉ chân",
        home: n > 1 ? `🏠 Cả ${n} người đang nghỉ trong nhà` : "🏠 Đang nghỉ ngơi ở nhà"}[ar] || "😊 Đang thư giãn";
      $("#togetherTime").textContent = fmtTime(t - togetherSince);
    } else if (togetherSince != null) { togetherSince = null; $("#together").classList.add("hidden"); }
  }
  updatePill();
  requestAnimationFrame(frame);
}

// ================== LOBBY ==================
(function lobby() {
  const params = new URLSearchParams(location.search);
  $("#nameInput").value = localStorage.getItem("nc_name") || "";
  $("#roomInput").value = (params.get("room") || "").toUpperCase();
  wantCh = +params.get("ch") || undefined;                       // link mời: vào cùng kênh với bạn
  myColor = localStorage.getItem("nc_color") || COLORS[Math.random() * COLORS.length | 0];
  const box = $("#colors");
  COLORS.forEach(c => {
    const b = document.createElement("button"); b.style.background = c; if (c === myColor) b.classList.add("sel");
    b.onclick = () => { myColor = c; box.querySelectorAll("button").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); };
    box.appendChild(b);
  });
  myPet.type = PETS[localStorage.getItem("nc_pet")] ? localStorage.getItem("nc_pet") : "cat";
  $("#petName").value = localStorage.getItem("nc_petname") || "";
  const pbox = $("#pets");
  const setPet = k => {
    myPet.type = k;
    pbox.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x.dataset.k === k));
    $("#petName").classList.toggle("hidden", k === "none");
    if (k !== "none") $("#petName").placeholder = `Tên thú cưng (mặc định: ${PETS[k].def})`;
  };
  Object.entries(PETS).forEach(([k, v]) => {
    const b = document.createElement("button"); b.dataset.k = k;
    b.innerHTML = `${v.e}<span>${v.label}</span>`; b.onclick = () => setPet(k);
    pbox.appendChild(b);
  });
  setPet(myPet.type);
  myGender = localStorage.getItem("nc_gender") === "g_m" ? "g_m" : "g_f";              // Nam / Nữ
  const gbox = $("#genders");
  const setG = g => { myGender = g; gbox.querySelectorAll("button").forEach(b => b.classList.toggle("sel", b.dataset.g === g)); };
  gbox.querySelectorAll("button").forEach(b => b.onclick = () => { setG(b.dataset.g); localStorage.setItem("nc_gender", b.dataset.g); });
  setG(myGender);
  // Mã phòng giờ chỉ dùng cho 🛏️ ký túc xá. Không nhập mã thì vào công viên (cổng vào).
  const AREA_OK = ["park", "study", "sleep", "cinema", "farm", "fishing", "mall", "home"];
  const go = (area, code) => {
    myName = $("#nameInput").value.trim();
    myPet.name = $("#petName").value.trim();
    localStorage.setItem("nc_pet", myPet.type); localStorage.setItem("nc_petname", myPet.name);
    if (!myName) { $("#lobbyErr").textContent = "Nhập tên trước đã nha!"; $("#nameInput").focus(); return; }
    dormCode = (code || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    wantKind = area === "sleep" && !dormCode ? "park" : area;
    localStorage.setItem("nc_name", myName); localStorage.setItem("nc_color", myColor);
    $("#lobbyErr").textContent = "Đang vào game…";
    Sound.ensure();                // mở khoá âm thanh trong lúc người dùng bấm
    connect();
  };
  $("#joinBtn").onclick = () => {
    const code = $("#roomInput").value, pa = params.get("area");
    const area = AREA_OK.includes(pa) ? pa : code.trim() ? "sleep" : "park";   // có mã phòng thì vào thẳng ký túc xá
    go(area, code);
  };
  $("#newBtn").onclick = () => { const s = randomCode(); $("#roomInput").value = s; go("sleep", s); };
  $("#roomInput").addEventListener("keydown", e => { if (e.key === "Enter") $("#joinBtn").click(); });
  // Vừa tự tải lại (chế độ phát triển): vào thẳng lại khu/kênh cũ, không cần bấm
  let back = null;
  try { back = JSON.parse(sessionStorage.getItem("nc_dev_back") || "null"); sessionStorage.removeItem("nc_dev_back"); } catch (e) {}
  if (back && back.area && $("#nameInput").value.trim())          // đợi areas.js/zones.js nạp xong rồi mới vào
    addEventListener("load", () => { wantCh = back.ch || undefined; go(back.area, back.room); });
})();
