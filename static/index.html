<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151229">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ngủ Cùng Nhau</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root{
    --bg:#0d0b1e; --panel:#1d1a38; --panel2:#2a2650; --text:#f3eefe; --muted:#a9a3c9;
    --accent:#ffd27a; --accent2:#9b8cff; --danger:#ff7a8a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;touch-action:none;display:block}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  .hidden{display:none!important}

  /* top bar */
  #top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
  .pill{pointer-events:auto;background:rgba(20,17,45,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
  #shareBtn{background:rgba(255,210,122,.18);border-color:rgba(255,210,122,.4)}

  #log{position:fixed;top:calc(46px + env(safe-area-inset-top));left:10px;max-width:70%;z-index:4;pointer-events:none;
    display:flex;flex-direction:column;gap:4px}
  #log div{background:rgba(10,8,25,.6);padding:4px 9px;border-radius:10px;font-size:12px;line-height:1.35;
    transition:opacity .8s;word-break:break-word;width:fit-content}
  #log b{color:var(--accent)}

  #together{position:fixed;left:50%;transform:translateX(-50%);top:calc(46px + env(safe-area-inset-top));z-index:4;
    background:rgba(40,30,90,.8);border:1px solid rgba(155,140,255,.5);padding:7px 14px;border-radius:999px;font-size:13px;
    box-shadow:0 0 24px rgba(155,140,255,.35);white-space:nowrap;animation:glow 3s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 36px rgba(155,140,255,.6)}}

  /* HUD */
  #hud{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px;z-index:5;padding:0 8px}
  #hud button{width:54px;height:56px;border-radius:16px;background:rgba(24,20,52,.82);border:1px solid rgba(255,255,255,.12);
    font-size:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .1s,background .2s}
  #hud button{padding:0}
  #hud button span{font-size:10px;color:var(--muted);white-space:nowrap}
  #hud button:active{transform:scale(.92)}
  #hud button.on{background:rgba(255,210,122,.22);border-color:rgba(255,210,122,.55)}
  #hud button.on span{color:var(--accent)}

  /* bottom sheet */
  #sheet{position:fixed;inset:0;z-index:20;background:rgba(5,4,15,.45);display:flex;align-items:flex-end;justify-content:center}
  .sheet-inner{width:100%;max-width:440px;background:var(--panel);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(255,255,255,.1);animation:up .22s ease-out;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  @keyframes up{from{transform:translateY(100%)}}
  .sheet-title{font-weight:700;margin-bottom:12px;font-size:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{background:var(--panel2);border-radius:14px;padding:13px 10px;font-size:14px;border:1px solid transparent;text-align:left}
  .opt.active{border-color:var(--accent);background:rgba(255,210,122,.15)}
  .opt.off{grid-column:1/-1;text-align:center;background:rgba(255,122,138,.15);color:#ffc2ca}
  .emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .emojis button{font-size:28px;background:var(--panel2);border-radius:14px;padding:8px 0}
  .vol{margin-top:14px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
  .vol:not(:has(input)){display:block}                       /* .vol dùng cho đoạn chữ: không xếp cột */
  .vol input{flex:1;accent-color:var(--accent)}

  /* YouTube */
  #tvFrame{position:fixed;z-index:3;background:#000;overflow:hidden;pointer-events:none;border-radius:3px}
  #tvFrame iframe,#ytMusic iframe{width:100%;height:100%;border:0;display:block;pointer-events:none}
  .ythold{width:100%;height:100%}
  #tvFrame.big{z-index:15;pointer-events:auto;left:50%!important;top:calc(64px + env(safe-area-inset-top))!important;transform:translateX(-50%);
    width:min(96vw,760px)!important;height:auto!important;aspect-ratio:16/9;border-radius:12px;
    box-shadow:0 0 0 4px #121216,0 12px 60px rgba(0,0,0,.75),0 0 90px rgba(150,160,255,.25)}
  #tvShrink{display:none;position:absolute;right:6px;top:6px;z-index:2;background:rgba(0,0,0,.6);padding:5px 10px;border-radius:999px;font-size:12px}
  #tvFrame.big #tvShrink{display:block}
  #ytMusic{position:fixed;left:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;width:160px;background:rgba(20,17,45,.92);
    border:1px solid rgba(255,255,255,.14);border-radius:12px;overflow:hidden;cursor:pointer}
  #ytMusic .mframe{width:160px;height:90px;transition:height .2s}
  #ytMusic.mini .mframe{height:1px;opacity:.01}
  #ytMusic .mtitle{font-size:11px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
  #ytUnlock{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:25;padding:14px 20px;border-radius:999px;
    background:var(--accent);color:#2a1c00;font-weight:800;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.5);white-space:nowrap}
  .ytrow{display:flex;gap:6px;margin-bottom:10px}
  .ytrow input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--text);outline:none}
  .ytrow button{padding:0 14px;border-radius:12px;background:#ff3d3d;color:#fff;font-weight:700;white-space:nowrap}
  .sec{font-size:12px;color:var(--muted);margin:12px 2px 8px}
  .timers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .timers button{background:var(--panel2);border-radius:12px;padding:11px 0;font-size:14px;border:1px solid transparent}
  .timers button.cancel{grid-column:1/-1;background:rgba(255,122,138,.15);color:#ffc2ca}

  /* Âm lượng */
  #volCtl{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:16;display:flex;flex-direction:column;align-items:center;gap:6px;
    background:rgba(20,17,45,.72);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #volCtl button{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);font-size:20px;font-weight:800;line-height:1}
  #volCtl button:active{transform:scale(.9);background:rgba(255,210,122,.3)}
  #volPct{font-size:11px;color:var(--accent);font-weight:700;min-width:34px;text-align:center}

  #sa{position:fixed;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #theater{position:fixed;z-index:2;background:#000;border-radius:12px;overflow:hidden;cursor:pointer;
    box-shadow:0 0 0 6px #121216,0 0 0 7px #2c2c36,0 20px 60px rgba(0,0,0,.6);transition:box-shadow .5s}
  #theater.glow{box-shadow:0 0 0 6px #121216,0 0 0 7px #2c2c36,0 0 90px rgba(150,160,255,.28)}
  #bigTV{width:100%;height:100%;display:block}
  #theaterOff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    color:var(--muted);font-size:34px;background:radial-gradient(ellipse at 30% 20%,#23262e,#0e1014)}
  #theaterOff div{font-size:15px;color:var(--text)}
  #theaterOff small{font-size:12px}
  #theaterTimer{position:fixed;z-index:4;background:rgba(0,0,0,.65);color:var(--accent);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;pointer-events:none}

  #chatBar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:6px;max-width:440px;margin:0 auto}
  #chatBar input{flex:1;font-size:16px;padding:11px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(20,17,45,.95);color:var(--text);outline:none}
  #chatBar button{padding:0 16px;border-radius:999px;background:var(--accent);color:#2a1c00;font-weight:700}

  #toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);opacity:0;z-index:30;
    background:rgba(255,255,255,.95);color:#1a1530;padding:8px 14px;border-radius:999px;font-size:13px;transition:.25s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%)}

  /* lobby */
  #lobby{position:fixed;inset:0;z-index:50;display:flex;padding:20px;
    background:radial-gradient(ellipse at 50% 0%,#3a2f7a 0%,#151229 55%,#0a0816 100%);overflow:auto}
  .card{width:100%;max-width:360px;text-align:center;margin:auto}
  .logo{font-size:56px;animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px) rotate(-6deg)}}
  h1{margin:4px 0 2px;font-size:28px;letter-spacing:.5px}
  .sub{margin:0 0 20px;color:var(--muted);font-size:14px}
  .card label{display:block;text-align:left;font-size:12px;color:var(--muted);margin:12px 4px 6px}
  .card input{width:100%;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--text);outline:none}
  .card input:focus{border-color:var(--accent2)}
  #roomInput{text-transform:uppercase;letter-spacing:3px}
  #colors{display:flex;gap:8px;justify-content:space-between}
  #colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
  #colors button.sel{border-color:#fff;transform:scale(1.1)}
  /* ================== BẢN ĐỒ THỊ TRẤN MINH HỌA ================== */
  #sheet:has(.town-map-wrap) .sheet-inner {
    max-width: min(95vw, 760px);
  }
  .town-map-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    max-height: min(60vh, 480px);
    margin: 0 auto;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
    user-select: none;
    touch-action: manipulation;
    container-type: inline-size;
    container-name: townmap;
    display: block;
  }
  .town-map-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  /* Màu nền SVG: Ban ngày */
  .town-map-bg .bg-terrain { fill: url(#gGrassDay); }
  .town-map-bg .bg-river { fill: url(#gRiverDay); }
  .town-map-bg .bg-school-yard { fill: #f5eedc; }
  .town-map-bg .bg-priv-yard { fill: #86efac; opacity: 0.35; }
  .town-map-bg .bg-priv-fence { stroke: #ffffff; }
  .town-map-bg .bg-farm-plot { fill: #d4a373; opacity: 0.9; }
  .town-map-bg .farm-furrow { stroke: #99582a; }
  .town-map-bg .bg-road-curb { stroke: #d1be9e; }
  .town-map-bg .bg-road-fill { stroke: #faf5e8; }
  .town-map-bg .bg-road-dash { stroke: #d1be9e; }
  .town-map-bg .bg-plaza { fill: #f8f3e6; }
  .town-map-bg .bridge-wood { fill: #b08968; }
  .town-map-bg .bridge-rail { stroke: #7f5539; }
  .town-map-bg .bridge-post { fill: #7f5539; }
  .town-map-bg { --tl1: #2d6a4f; }
  .town-map-bg { --tl2: #40916c; }
  .town-map-bg { --tl3: #52b788; }
  .town-map-bg { --pl1: #1b4332; }
  .town-map-bg { --pl2: #2d6a4f; }
  .town-map-bg { --pl3: #40916c; }
  .town-map-bg .lamp-bulb { fill: #fde047; }
  .town-map-bg .lamp-light-circle { display: none; }
  .town-map-bg .map-star { display: none; fill: #fef08a; }

  /* Màu nền SVG: Ban đêm */
  .town-map-wrap.night .town-map-bg .bg-terrain { fill: url(#gGrassNight); }
  .town-map-wrap.night .town-map-bg .bg-river { fill: url(#gRiverNight); }
  .town-map-wrap.night .town-map-bg .bg-school-yard { fill: #1e2538; }
  .town-map-wrap.night .town-map-bg .bg-priv-yard { fill: #2e1065; opacity: 0.45; }
  .town-map-wrap.night .town-map-bg .bg-priv-fence { stroke: #7c3aed; }
  .town-map-wrap.night .town-map-bg .bg-farm-plot { fill: #2a1f17; opacity: 0.9; }
  .town-map-wrap.night .town-map-bg .farm-furrow { stroke: #19120b; }
  .town-map-wrap.night .town-map-bg .bg-road-curb { stroke: #1a1f33; }
  .town-map-wrap.night .town-map-bg .bg-road-fill { stroke: #252d47; }
  .town-map-wrap.night .town-map-bg .bg-road-dash { stroke: #384266; }
  .town-map-wrap.night .town-map-bg .bg-plaza { fill: #20273d; }
  .town-map-wrap.night .town-map-bg .bridge-wood { fill: #4a3322; }
  .town-map-wrap.night .town-map-bg .bridge-rail { stroke: #2d1d12; }
  .town-map-wrap.night .town-map-bg .bridge-post { fill: #2d1d12; }
  .town-map-wrap.night .town-map-bg { --tl1: #132a22; }
  .town-map-wrap.night .town-map-bg { --tl2: #1a382d; }
  .town-map-wrap.night .town-map-bg { --tl3: #224c3d; }
  .town-map-wrap.night .town-map-bg { --pl1: #0e2019; }
  .town-map-wrap.night .town-map-bg { --pl2: #132a22; }
  .town-map-wrap.night .town-map-bg { --pl3: #1a382d; }
  .town-map-wrap.night .town-map-bg .lamp-light-circle { display: block; }
  .town-map-wrap.night .town-map-bg .map-star { display: block; }
  .town-map-wrap.night .win-glow { fill: #fde047 !important; filter: drop-shadow(0 0 3px #facc15); }

  /* Hiệu ứng sao lấp lánh ban đêm */
  @keyframes starTwinkle1 { 0%, 100% { opacity: 0.2; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes starTwinkle2 { 0%, 100% { opacity: 0.9; transform: scale(1.1); } 50% { opacity: 0.15; transform: scale(0.75); } }
  @keyframes starTwinkle3 { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  .town-map-wrap.night .map-star.s1 { animation: starTwinkle1 2.6s infinite ease-in-out; transform-origin: center; }
  .town-map-wrap.night .map-star.s2 { animation: starTwinkle2 3.4s infinite ease-in-out -1.2s; transform-origin: center; }
  .town-map-wrap.night .map-star.s3 { animation: starTwinkle3 4s infinite ease-in-out -2.2s; transform-origin: center; }

  /* Mây bay lượn */
  @keyframes cloudDrift {
    0% { transform: translateX(-120px); }
    100% { transform: translateX(1050px); }
  }
  .map-cloud {
    position: absolute;
    pointer-events: none;
    z-index: 4;
  }
  .map-cloud.c1 { top: 8%; animation: cloudDrift 38s linear infinite; }
  .map-cloud.c2 { top: 38%; animation: cloudDrift 54s linear infinite -20s; }
  .map-cloud.c3 { top: 62%; animation: cloudDrift 44s linear infinite -30s; }
  .town-map-wrap.night .map-cloud svg path { fill: rgba(140, 160, 210, 0.2); }

  /* Địa danh: Cổng vào & Khu riêng */
  .town-gate {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 3;
    pointer-events: none;
    background: rgba(18, 14, 38, 0.82);
    border: 1px dashed rgba(255, 255, 255, 0.25);
    border-radius: 9px;
    padding: 3px 6px;
    font-size: 10.5px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    line-height: 1.15;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .town-gate small {
    display: block;
    font-size: 8.5px;
    font-weight: 400;
    color: var(--muted);
  }
  .town-priv-label, .privhead {
    position: absolute;
    transform: translate(-50%, 0);
    z-index: 3;
    pointer-events: none;
    background: rgba(155, 140, 255, 0.22);
    border: 1px solid rgba(155, 140, 255, 0.45);
    border-radius: 8px;
    padding: 2px 7px;
    font-size: 10.5px;
    font-weight: 700;
    color: #d8b4fe;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  /* Ghim bản đồ (Pin buttons) */
  .town-pin {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: none !important;
    border: none !important;
    padding: 0 !important;
    margin: 0;
    cursor: pointer;
    z-index: 6;
    transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .town-pin::after {
    content: "";
    position: absolute;
    inset: -8px -6px;
    z-index: 1;
  }
  .town-pin:hover, .town-pin:focus-visible {
    transform: translate(-50%, -50%) scale(1.12);
    z-index: 12;
  }
  .town-pin:active {
    transform: translate(-50%, -50%) scale(0.94);
  }

  .pin-icon-wrap {
    width: 34px;
    height: 34px;
    width: clamp(28px, 6.2cqw, 38px);
    height: clamp(28px, 6.2cqw, 38px);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.94);
    border: 2px solid #ffffff;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.2s ease;
    overflow: visible;
  }
  .pin-icon-wrap svg {
    width: 82%;
    height: 82%;
    display: block;
  }
  .town-map-wrap.night .pin-icon-wrap {
    background: rgba(24, 28, 48, 0.94);
    border-color: rgba(255, 215, 0, 0.45);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5), 0 0 8px rgba(255, 215, 0, 0.25);
  }
  .town-pin.private .pin-icon-wrap {
    border-color: #c084fc;
    box-shadow: 0 3px 8px rgba(168, 85, 247, 0.35);
  }
  .town-pin.cur .pin-icon-wrap {
    border-color: #ef4444;
    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
    animation: pinPulseRing 1.8s infinite;
  }
  @keyframes pinPulseRing {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    70% { box-shadow: 0 0 0 9px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }
  .pin-marker {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    animation: markerBob 1.2s ease-in-out infinite alternate;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    pointer-events: none;
    z-index: 8;
  }
  @keyframes markerBob {
    0% { transform: translateX(-50%) translateY(0); }
    100% { transform: translateX(-50%) translateY(-5px); }
  }
  .town-pin.soon {
    opacity: 0.55;
    filter: grayscale(0.85);
  }
  .town-pin.soon .pin-icon-wrap {
    border-style: dashed;
    border-color: rgba(255, 255, 255, 0.4);
    background: rgba(180, 180, 190, 0.6);
  }

  .pin-label-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(15, 12, 32, 0.88);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    padding: 1px 5px;
    border-radius: 7px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    max-width: 80px;
    max-width: clamp(72px, 19cqw, 120px);
    text-align: center;
    pointer-events: none;
    transition: all 0.2s ease;
  }
  .pin-name {
    font-size: 10px;
    font-size: clamp(8.5px, 2.1cqw, 11px);
    font-weight: 700;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

  /* hiệu ứng chuyển khu: mờ dần 0.4s */

    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--accent)}

  /* Phòng học */

  #pomoPill.focus{background:rgba(255,99,71,.28);border-color:rgba(255,120,100,.6)}
  #pomoPill.break{background:rgba(94,242,168,.2);border-color:rgba(94,242,168,.55)}
  #pomoPill.paused{opacity:.7}
  .pomoBig{text-align:center;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;margin:0 0 2px}
  .pomoSub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
  .timers button.cur{border-color:var(--accent);background:rgba(255,210,122,.15)}
  .board{display:flex;flex-direction:column;gap:4px;font-size:14px}
  .board div{display:flex;justify-content:space-between;gap:8px;background:var(--panel2);padding:8px 12px;border-radius:10px}
  .board small{color:var(--muted)}
  .board b{color:var(--accent);font-variant-numeric:tabular-nums}
  #pets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  #genders{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #genders button,#pets button{background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:14px;padding:8px 0 6px;font-size:24px;
    display:flex;flex-direction:column;align-items:center;gap:2px}
  #pets button span,#genders button span{font-size:11px;color:var(--muted)}
  #genders button.sel,#pets button.sel{border-color:var(--accent);background:rgba(255,210,122,.12)}
  #petName{margin-top:6px}
  .primary{width:100%;margin-top:18px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#ffd27a,#ffb36b);color:#2a1c00;font-weight:800;font-size:16px}
  .ghost{width:100%;margin-top:8px;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);font-size:15px}

  .stars-bg{position:fixed;inset:0;pointer-events:none}

  /* Thanh cuộc sống: chỉ số, đồng hồ trong game, hoạt động của khu (life.js) */
  #lifeStats{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  #actPill{margin-left:auto;background:rgba(155,140,255,.25);border-color:rgba(155,140,255,.55)}
  .mbar{display:inline-block;width:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;vertical-align:middle}
  .mbar i{display:block;height:100%;border-radius:3px}
  .statRow{display:grid;grid-template-columns:110px 1fr 56px;align-items:center;gap:8px;font-size:14px;padding:5px 2px}
  .statRow .mbar{width:100%;height:9px}
  .statRow b{text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
  .opt small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .opt.poor{opacity:.5}
  .opt.right{border-color:#5ef2a8;background:rgba(94,242,168,.2)}
  .opt.wrong{border-color:var(--danger);background:rgba(255,122,138,.2)}
  .quizText{font-size:16px;font-weight:700;margin:2px 2px 14px;line-height:1.4}
  .wheelBig{font-size:72px;text-align:center;margin:8px 0}
  .tabs{display:flex;gap:4px;overflow-x:auto;margin:10px 0;padding-bottom:2px}
  .tabs button{flex:0 0 auto;background:var(--panel2);border-radius:12px;padding:6px 9px;font-size:16px;display:flex;flex-direction:column;align-items:center;border:1px solid transparent}
  .tabs button span{font-size:10px;color:var(--muted)}
  .tabs button.cur{border-color:var(--accent);background:rgba(255,210,122,.15)}
  .mini{background:var(--accent);color:#2a1c00;font-weight:700;border-radius:10px;padding:6px 8px;font-size:12px}
  .mini.ghostb{background:rgba(255,255,255,.1);color:var(--text);font-weight:500}
  .del{background:none;font-size:13px;padding:0 0 0 6px;opacity:.7}

  /* ================== BỐ CỤC NGANG (landscape) cho cả điện thoại và máy tính ================== */
  :root{--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--kb:0px}
  /* Thanh trên: trái = khu/kênh + chỉ số, phải = giờ, nút menu */
  #top{position:fixed;top:calc(8px + var(--st));left:calc(10px + var(--sl));right:calc(10px + var(--sr));display:flex;justify-content:space-between;
    align-items:center;gap:8px;pointer-events:none;z-index:5}
  .tgroup{display:flex;gap:6px;align-items:center;min-width:0}
  #top .pill{height:36px;display:flex;align-items:center;gap:4px}
  #top .pill.icon{width:40px;justify-content:center;padding:0;font-size:17px}
  #lifeStats{min-width:0;overflow:hidden;text-overflow:ellipsis}
  #actPill{background:rgba(155,140,255,.25);border-color:rgba(155,140,255,.55)}
  #log{position:fixed;top:calc(52px + var(--st));left:calc(10px + var(--sl));max-width:min(42vw,460px);z-index:4;pointer-events:none;
    display:flex;flex-direction:column;gap:4px}
  #log div{background:rgba(10,8,25,.6);padding:4px 9px;border-radius:10px;font-size:12px;line-height:1.35;transition:opacity .8s;word-break:break-word;width:fit-content}
  #together{top:calc(52px + var(--st))}
  #pomoPill{position:fixed;right:calc(10px + var(--sr));top:calc(52px + var(--st))}
  /* Hàng nút giữa dưới */
  #hud{position:fixed;left:50%;transform:translateX(-50%);right:auto;bottom:calc(10px + var(--sb));display:flex;gap:6px;z-index:5;padding:0}
  #hud button{width:54px;height:54px}
  /* Cần điều khiển ảo (chỉ hiện trên máy cảm ứng) */
  #joy{position:fixed;left:calc(18px + var(--sl));bottom:calc(16px + var(--sb));width:118px;height:118px;border-radius:50%;z-index:6;touch-action:none;
    background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.18);display:none;opacity:.55;transition:opacity .2s}
  #joy.on{opacity:.9}
  #joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.35);
    border:2px solid rgba(255,255,255,.5);box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none}
  /* Nút Tương tác (E) góc dưới phải */
  #actBtns{position:fixed;right:calc(18px + var(--sr));bottom:calc(18px + var(--sb));z-index:6;display:none;gap:12px;align-items:flex-end}
  #actBtns button{width:66px;height:66px;border-radius:50%;background:rgba(255,210,122,.28);border:2px solid rgba(255,210,122,.65);
    font-size:22px;font-weight:800;color:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #actBtns button:active{transform:scale(.9)}
  #actBtns button small{display:block;font-size:10px;font-weight:600;color:var(--text)}
  body.touch #joy,body.touch #actBtns{display:flex}
  body.touch #joy{display:block}
  body.lefty #joy{left:auto;right:calc(18px + var(--sr))}
  body.lefty #actBtns{right:auto;left:calc(18px + var(--sl))}
  /* Chat: nổi lên trên bàn phím điện thoại */
  #chatBar{left:50%;right:auto;transform:translateX(-50%);width:min(560px,calc(100vw - 300px));min-width:260px;bottom:calc(74px + var(--sb) + var(--kb));margin:0;max-width:none}
  #toast{bottom:calc(78px + var(--sb))}
  #ytMusic{left:auto;right:calc(12px + var(--sr));bottom:calc(98px + var(--sb))}
  #volCtl{transform:translateY(-50%) scale(.85);opacity:.85}
  /* Bảng (sheet) rộng hơn trên màn hình ngang */
  .sheet-inner{max-width:640px;max-height:86vh}
  /* Nhắc xoay ngang */
  #rotate{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 30%,#3a2f7a,#0d0b1e 70%)}
  #rotate .ph{font-size:64px;animation:turn 2.2s ease-in-out infinite}
  @keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
  #rotate small{color:var(--muted)}
  @media (orientation:portrait) and (pointer:coarse){ body.ingame #rotate{display:flex} }
  /* Màn hình thấp (điện thoại ngang): thu nhỏ chữ, nút */
  @media (max-height:460px){
    #top .pill{height:32px;font-size:12px;padding:0 9px}
    #top .pill.icon{width:34px;font-size:15px}
    #log{max-width:min(34vw,330px)}
    #log div{font-size:10.5px;padding:3px 8px;background:rgba(10,8,25,.5)}
    #log div:nth-last-child(n+4){display:none}
    .map:not(.town-map-wrap) .opt,.mapgate:not(.town-gate){padding:7px 4px;font-size:12px}
    .maphint{display:none}
    .sheet-title{margin-bottom:8px}
    #hud button{width:48px;height:48px;font-size:18px;border-radius:14px}
    #hud button span{font-size:9px}
    #joy{width:104px;height:104px}
    #actBtns button{width:58px;height:58px}
    #shareBtn .lbl{display:none}
    .sheet-inner{max-height:92vh;padding-top:12px}
  }
  /* Sảnh vào game: 2 cột khi màn hình ngang thấp */
  @media (orientation:landscape) and (max-height:600px){
    .card{max-width:760px;display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}
    .logo{font-size:40px} h1{font-size:24px}
  }

  /* ================== PIN (ver_3 V2.2) ================== */
  #battPill{font-variant-numeric:tabular-nums;font-weight:700}
  #battPill.g{color:#7ee787} #battPill.y{color:#ffd166} #battPill.r{color:#ff6b6b}
  #clockPill{font-variant-numeric:tabular-nums}
  /* ================== THANH NHANH (ver_3 V2.1) ================== */
  #quick{position:fixed;right:calc(12px + var(--sr));top:calc(56px + var(--st));z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
  #quick .qitems{display:flex;flex-direction:column;gap:12px}
  .qb,.qarrow{pointer-events:auto;position:relative;width:56px;height:56px;border-radius:50%;padding:0;font-size:28px;line-height:1;
    display:flex;align-items:center;justify-content:center;background:rgba(24,20,52,.74);border:1px solid rgba(255,255,255,.2);
    box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .qb{transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .22s;transition-delay:calc(var(--i) * 40ms)}
  .qarrow{width:48px;height:48px;font-size:26px;font-weight:800;color:var(--accent);transition:opacity .25s}
  .qb.pop{animation:qpop .22s ease-out}
  @keyframes qpop{50%{transform:scale(1.1)}}
  @media (hover:hover){ .qb:hover{transform:scale(1.1)} }
  /* thu gọn (hoặc đang mở bảng): các nút trượt ra mép và mờ dần lần lượt */
  #quick.collapsed .qb,body.sheet-open #quick .qb{transform:translateX(150%);opacity:0;pointer-events:none;transition-delay:calc((5 - var(--i)) * 40ms)}
  #quick.collapsed .qarrow{opacity:.6}
  body.sheet-open #quick .qarrow{opacity:0;pointer-events:none}
  .dot{position:absolute;top:0;right:0;min-width:18px;height:18px;border-radius:9px;background:#ff3b5c;color:#fff;font-size:11px;font-style:normal;
    font-weight:800;line-height:18px;padding:0 4px;box-shadow:0 0 0 2px rgba(20,17,45,.9)}
  /* chú thích tên nút + phím tắt khi rê chuột (máy tính) */
  @media (hover:hover){ .qb[data-tip]:hover::after{content:attr(data-tip);position:absolute;right:66px;top:50%;transform:translateY(-50%);white-space:nowrap;
    background:rgba(10,8,25,.92);padding:5px 10px;border-radius:8px;font-size:13px;color:var(--text);pointer-events:none} }
  /* tay trái: thanh nhanh sang mép trái */
  body.lefty #quick{right:auto;left:calc(12px + var(--sl));align-items:flex-start}
  body.lefty #quick.collapsed .qb,body.lefty.sheet-open #quick .qb{transform:translateX(-150%)}
  @media (hover:hover){ body.lefty .qb[data-tip]:hover::after{right:auto;left:66px} }
  #pomoPill{right:calc(84px + var(--sr))}
  body.lefty #pomoPill{right:calc(10px + var(--sr))}
  #volCtl{display:none!important}                              /* âm lượng chuyển vào ⚙️ Cài đặt */
  .setrow{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer;min-height:56px}
  .setrow input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
  .setrow small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  /* điện thoại ngang (màn thấp): nút nhỏ hơn, xếp 2 cột để không đè nút E */
  @media (max-height:460px){
    #quick{top:calc(48px + var(--st));gap:8px}
    #quick .qitems{display:grid;grid-template-columns:44px 44px;gap:8px}
    .qb{width:44px;height:44px;font-size:21px}
    .qarrow{width:40px;height:40px;font-size:22px}
    .dot{min-width:15px;height:15px;line-height:15px;font-size:9px}
    #pomoPill{right:calc(112px + var(--sr))}
  }
  /* ---- 3 khu mới (zones.js) ---- */
  .up{color:#39d98a}.dn{color:#ff5d6c}.eq{color:#ffd166}
  .rules{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5}.rules summary{cursor:pointer;color:var(--text);font-weight:700}
  .rtab{width:100%;border-collapse:collapse;margin:6px 0;font-size:11px}.rtab td,.rtab th{padding:3px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center}
  .bcDice{display:flex;justify-content:center;gap:8px;font-size:34px;margin:4px 0 8px}.bcDice span{background:#fff;border-radius:10px;padding:2px 6px}
  .bcDice.shake{animation:bcShake .15s infinite}@keyframes bcShake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .bcGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .bcCell{position:relative;background:#fff8e7;color:#7a1d1d;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;border:2px solid transparent}
  .bcCell b{font-size:28px}.bcCell span{font-weight:800;font-size:12px}.bcCell small{font-size:10px;color:#9c6644}.bcCell em{color:#c1121f;font-style:normal;font-weight:800}
  .bcCell.hit{border-color:#ffd166;box-shadow:0 0 12px #ffd166}.bcCell i{position:absolute;top:2px;right:6px;font-style:normal;font-weight:900;color:#c1121f}
  .bcCell:disabled{opacity:.85}.timers button.cur{outline:2px solid var(--accent)}
  .bcHist{display:flex;flex-wrap:wrap;gap:4px;font-size:14px}.bcHist span{background:var(--panel2);border-radius:8px;padding:1px 4px}
  .lottoBall{display:flex;justify-content:center;gap:8px;margin:6px 0 10px}.lottoBall span{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd166);color:#7a1d1d;font:900 20px Nunito,system-ui;display:grid;place-items:center}
  .lottoBall em{color:var(--muted);font-style:normal}
  .stkWrap{display:grid;grid-template-columns:150px 1fr;gap:8px}.stkList{display:flex;flex-direction:column;gap:2px;max-height:330px;overflow-y:auto}
  .stkRow{display:grid;grid-template-columns:1fr auto;background:var(--panel2);border-radius:8px;padding:3px 6px;text-align:left;font-size:12px;border:1px solid transparent}
  .stkRow small{grid-column:2;text-align:right;font-size:10px}.stkRow.sel{border-color:var(--accent)}
  .stkName{font-weight:800}.stkName small{display:block;font-weight:400;color:var(--muted);font-size:11px}.stkPrice{font:900 26px monospace}.stkPrice small{font-size:13px}
  .dcards{display:flex;flex-direction:column;gap:8px}.dcard{display:grid;grid-template-columns:60px 1fr;gap:8px;background:var(--panel2);border-radius:14px;padding:8px}
  .dcard canvas{width:60px;height:70px;background:linear-gradient(#ffd6e7,#cdb4db);border-radius:10px}.dbio{font-size:12px;color:var(--muted);margin:2px 0}.dhob{font-size:11px}
  .dbtns{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .hobs{display:flex;flex-wrap:wrap;gap:4px}.hob{background:var(--panel2);border-radius:20px;padding:4px 9px;font-size:12px;border:1px solid transparent}.hob.on{border-color:#ff8fab;background:rgba(255,143,171,.25)}
  @media (max-width:520px){.stkWrap{grid-template-columns:1fr}.stkList{max-height:120px}}

  /* ================== MENU PHIM RẠP (CINEMA) ================== */
  .cin-now{display:flex;gap:12px;background:var(--panel2);border-radius:16px;padding:12px;border:1px solid rgba(255,255,255,.08);margin-bottom:12px;align-items:flex-start}

  .cin-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}

  stop() {

  ambTimers: [], ambSrcs: [], ambBus: null, ambKind: undefined,
  ambient(kind) {                      // âm thanh nền: lửa lách tách + đồng hồ / chim hót / dế kêu

  lullaby(c, bus) {

  // 🌧️ Tiếng mưa
  rain(c, bus) {

// Tính lịch chiếu theo giờ thật (lặp vòng neo tại mốc unix 0)
function getCinemaSched(now = serverNow()) {
  const total = FILMS.reduce((s, f) => s + f.len, 0);
  if (!total) return null;
  let off = ((now % total) + total) % total;
  let accum = 0;
  for (let i = 0; i < FILMS.length; i++) {
    const f = FILMS[i];
    if (off < accum + f.len) {
      const pos = off - accum;
      return {
        film: f,
        index: i,
        pos,
        startTime: now - pos,
        total
      };
    }
    accum += f.len;
  }
  return {film: FILMS[0], index: 0, pos: 0, startTime: now, total};
}

        onError: e => toast([101, 150].includes(e.data) ? "Video này không cho phát nhúng, thử video khác nhé" : "Không phát được video này 😢"),
      },
    });
    return;
  }
  syncYT(slot);
}
function syncYT(slot) {
  const m = media[slot], p = YTP[slot];
  if (!m || !p || !p.ready || p.id !== m.id) return;
  const pl = p.pl, st = pl.getPlayerState(), want = mediaPos(m);
  const live = !!(pl.getVideoData && (pl.getVideoData() || {}).isLive), dur = pl.getDuration() || 0;
  if (!live && dur > 0 && want < dur - 1 && Math.abs(pl.getCurrentTime() - want) > 3) pl.seekTo(want, true);
  if (m.paused) { if (st === 1 || st === 3) pl.pauseVideo(); return; }
  if (st === 0) return;                                      // video đã hết
  if (st !== 1 && st !== 3) {                                // trình duyệt chặn tự phát
    pl.playVideo();
    if (++p.fails >= 2) pl.mute();
  }
  updateUnlock();
}
function updateUnlock() {
  const need = ["tv", "music"].some(s => {
    const p = YTP[s], m = media[s];
    return p && p.ready && m && !m.paused && (p.fails >= 2 || p.pl.isMuted());
  });
  $("#ytUnlock").classList.toggle("hidden", !need || !joined);
}
$("#ytUnlock").onclick = () => {
  for (const s of ["tv", "music"]) {
    const p = YTP[s]; if (!p || !p.ready || !media[s]) continue;
    p.pl.unMute(); p.pl.setVolume(Math.round(Sound.vol * 100));
    if (!media[s].paused) p.pl.playVideo();
    p.fails = 0;
  }
  $("#ytUnlock").classList.add("hidden");
};
setInterval(() => { syncYT("tv"); syncYT("music"); }, 3000);
setInterval(() => { if (joined) fetch("/ping", {cache: "no-store"}).catch(() => {}); }, 4 * 60 * 1000); // giữ server free không ngủ
function placeTV() {
  const f = $("#tvFrame");
  if (!theater && !SCR) return;
  const r = theater || {x: ox + SCR.x * scale, y: oy + SCR.y * scale, w: SCR.w * scale, h: SCR.h * scale};
  f.style.left = r.x + "px"; f.style.top = r.y + "px";
  f.style.width = r.w + "px"; f.style.height = r.h + "px";
  f.classList.toggle("big", tvBig && !theater);
}
function placeTheater() {
  const th = $("#theater"), tm = $("#theaterTimer");
  if (!theater || !joined) { th.classList.add("hidden"); tm.classList.add("hidden"); $("#volCtl").style.right = ""; return; }
  th.classList.remove("hidden");
  Object.assign(th.style, {left: theater.x + "px", top: theater.y + "px", width: theater.w + "px", height: theater.h + "px"});
  tm.style.right = (vw - theater.x - theater.w + 10) + "px"; tm.style.top = (theater.y + theater.h - 34) + "px";
  $("#volCtl").style.right = (vw - theater.x - theater.w + 8) + "px";
  bigTV.width = Math.round(theater.w * dpr); bigTV.height = Math.round(theater.h * dpr);
}

};
const FAST_KEY = "nc_fasttravel";
const fastTravel = () => localStorage.getItem(FAST_KEY) === "1";
const instLabel = () => !inst ? "" : inst.area === "sleep" ? `Phòng ${inst.code}`
  : inst.ch ? `Kênh ${inst.ch}` : inst.area === "home" ? "Nhà của bạn" : "Nông trại của bạn";

// Đi tới khu `area` (opts: {room: mã ký túc xá, ch: kênh}): mờ dần 0.4s rồi xin server chuyển khu
function travelTo(area, opts = {}) {
  if (!MAP_PINS[area] || MAP_PINS[area].kind === "soon") return;
  if (!ws || ws.readyState !== 1) { toast("Đang kết nối lại server… thử lại sau chút nhé"); return; }
  if (traveling) return;
  if (area === myArea && area !== "sleep" && opts.ch == null) { toast(`Bạn đang ở ${AREA_NAME[area]} rồi`); return; }
  traveling = true; pendingDoor = false;
  const name = MAP_PINS[area].name || AREA_NAME[area];
  $("#fadeText").textContent = `🚌 Đang đi tới ${name}…`;
  const go = () => send({t: "go", area, room: opts.room, ch: opts.ch});
  clearTimeout(travelGuard);
  travelGuard = setTimeout(() => { if (traveling) { endTravel(); toast("Chuyển khu chưa được, thử lại nhé"); } }, 6000);
  if (fastTravel()) { go(); return; }
  $("#fade").classList.add("on");
  setTimeout(go, 400);
}
let travelGuard = null;
function endTravel() { traveling = false; clearTimeout(travelGuard); $("#fade").classList.remove("on"); }

function openChannels() {

  if (!list.some(c => c[0] === inst.ch)) list.push([inst.ch, here().length]);
  const next = Math.max(0, ...list.map(c => c[0])) + 1;
  list.sort((a, b) => a[0] - b[0]);
  openSheet(`📡 Kênh · ${AREA_NAME[inst.area]}`,
    `<div class="grid">${list.map(([c, n]) => `<button class="opt ${c === inst.ch ? "active" : ""}" data-c="${c}">Kênh ${c}<small>👥 ${n}/25${c === inst.ch ? " · bạn ở đây" : ""}</small></button>`).join("")}
     <button class="opt" data-c="${next}">✨ Kênh ${next}<small>kênh trống</small></button></div>`,
    el => el.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
      const c = +b.dataset.c; closeSheet();
      if (c !== inst.ch) travelTo(inst.area, {ch: c});
    }));
}
function randomCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = "";
  for (let i = 0; i < 5; i++) s += A[Math.random() * A.length | 0];
  return s;
}
// ================== PIN + TIẾT KIỆM PIN (ver_3 V2.2) ==================
// Hiện % pin của thiết bị (Battery Status API). Trình duyệt không hỗ trợ (Safari/iPhone, Firefox) thì ẩn, không báo lỗi.
// Tiết kiệm pin: 30 FPS, độ nét 1x, tắt bớt hiệu ứng (đom đóm, lá rơi theo mùa, dây đèn). Chế độ: auto | on | off
const Power = (() => {
  const KEY = "nc_power", LOW = 15;                          // LOW_BATTERY_THRESHOLD: pin ≤ 15% và không sạc thì tự bật
  let batt = null, on = false, warned = false;
  const mode = () => localStorage.getItem(KEY) || "auto";
  function update() {
    const pill = $("#battPill");
    let low = false;
    if (batt) {
      const pct = Math.round(batt.level * 100);
      low = pct <= LOW && !batt.charging;
      pill.textContent = `${batt.charging ? "⚡" : "🔋"}${pct}%`;
      pill.className = "pill batt " + (pct > 50 ? "g" : pct >= 20 ? "y" : "r");
      pill.title = batt.charging ? "Đang sạc" : "Pin thiết bị";
    }
    const was = on;
    on = mode() === "on" || (mode() === "auto" && low);
    document.body.classList.toggle("saver", on);
    if (on !== was) resize();                               // đổi độ nét màn hình
    if (on && !was && mode() === "auto" && !warned) { warned = true; toast("🪫 Pin yếu: đã bật chế độ tiết kiệm pin (tắt được trong ⚙️ Cài đặt)"); }
  }
  try {
    if (navigator.getBattery) navigator.getBattery().then(b => {
      batt = b;
      b.addEventListener("levelchange", update); b.addEventListener("chargingchange", update);
      update();
    }).catch(() => {});
  } catch (e) {}
  return {on: () => on, mode, set(m) { localStorage.setItem(KEY, m); warned = true; update(); }, update, supported: () => !!batt};
})();

// ================== THANH NHANH (ver_3 V2.1): nút tròn dọc mép phải, thu gọn / mở rộng bằng nút mũi tên ==================
// 👗 tủ đồ (C) · 🎒 túi đồ (I) · 🏆 xếp hạng (L) · 🗺️ bản đồ (M) · 👥 bạn bè · ⚙️ cài đặt · mũi tên thu/mở (B)
const Quick = (() => {
  const el = $("#quick"), KEY = "nc_quick", AUTO = "nc_qauto";
  const phone = () => matchMedia("(pointer:coarse)").matches;
  // Ghi nhớ trạng thái trên máy; mặc định: máy tính mở sẵn, điện thoại thu gọn (cho cảnh thoáng)
  let open = (() => { const v = localStorage.getItem(KEY); return v ? v === "1" : !phone(); })();
  const badges = {ward: 0, bag: 0, rank: 0, friends: 0};
  let idle = null;
  const fmt = n => n > 9 ? "9+" : String(n);
  function render() {
    el.classList.toggle("collapsed", !open);
    const left = document.body.classList.contains("lefty");
    $("#qToggle .arw").textContent = open !== left ? "›" : "‹";         // mở: chỉ ra mép màn hình; thu: chỉ vào trong
    $("#qToggle").title = (open ? "Thu gọn" : "Mở") + " thanh nhanh (B)";
    let total = 0;
    el.querySelectorAll(".qb").forEach(b => {
      const n = badges[b.dataset.q] || 0, d = b.querySelector(".dot"); total += n;
      d.classList.toggle("hidden", !n); d.textContent = fmt(n);
    });
    const ad = $("#qToggle .dot");                                       // chấm đỏ tổng khi đang thu gọn
    ad.classList.toggle("hidden", open || !total); ad.textContent = fmt(total);
  }
  function poke() {                                                      // tự thu gọn sau 6 giây (tùy chọn, mặc định tắt)
    clearTimeout(idle);
    if (open && localStorage.getItem(AUTO) === "1") idle = setTimeout(() => { open = false; render(); }, 6000);
  }
  function toggle(v = !open) { open = v; localStorage.setItem(KEY, open ? "1" : "0"); render(); poke(); }
  function badge(k, n) { badges[k] = n; render(); }
  function act(q) {
    if (!joined) return;
    Sound.ensure(); poke();
    if (q === "ward") Areas.openWardrobe();
    else if (q === "bag") Life.openBag();
    else if (q === "rank") openRanking();
    else if (q === "map") openMap();
    else if (q === "friends") openPeople();
    else if (q === "settings") openSettings();
  }
  $("#qToggle").onclick = () => { Sound.ensure(); toggle(); };
  el.querySelectorAll(".qb").forEach(b => b.onclick = () => {
    b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");   // phình nhẹ rồi mở bảng
    setTimeout(() => act(b.dataset.q), 120);
  });
  el.addEventListener("pointerdown", poke);
  render();
  return {toggle, badge, render, act, show() { el.classList.remove("hidden"); render(); poke(); }};
})();

      el.querySelector("#vol").oninput = e => { Sound.setVol(+e.target.value); el.querySelector("#volP").textContent = Math.round(Sound.vol * 100) + "%"; showVol(); };
      el.querySelector("#sLefty").onchange = e => {
        document.body.classList.toggle("lefty", e.target.checked); localStorage.setItem("nc_lefty", e.target.checked ? "1" : "0"); Quick.render();
      };
      el.querySelector("#sAuto").onchange = e => localStorage.setItem("nc_qauto", e.target.checked ? "1" : "0");
      el.querySelector("#sFast").onchange = e => localStorage.setItem(FAST_KEY, e.target.checked ? "1" : "0");
      el.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => { setZoom(b.dataset.zoom); el.querySelectorAll("[data-zoom]").forEach(x => x.classList.toggle("cur", x === b)); });
      el.querySelectorAll("[data-pw]").forEach(b => b.onclick = () => {
        Power.set(b.dataset.pw); el.querySelectorAll("[data-pw]").forEach(x => x.classList.toggle("cur", x === b));
        toast(Power.on() ? "🪫 Đang tiết kiệm pin" : "⚡ Đã tắt tiết kiệm pin");
      });

}
$("#mapBtn").onclick = () => { if (joined) openMap(); };
$("#instPill").onclick = () => { if (joined) openChannels(); };
$("#tvShrink").onclick = () => { tvBig = false; placeTV(); };
$("#ytMusic").onclick = () => $("#ytMusic").classList.toggle("mini");
function ytToggle(slot) {
  const m = media[slot], p = YTP[slot]; if (!m) return;
  const pos = p && p.ready ? p.pl.getCurrentTime() : mediaPos(m);
  send({t: "media", slot, a: m.paused ? "play" : "pause", pos});
}
// ================== ÂM LƯỢNG + HẸN GIỜ ==================
let tvTimerEnd = null;
function showVol() { $("#volPct").textContent = Math.round(Sound.vol * 100) + "%"; }
function stepVol(d) {
  Sound.ensure();
  const v = Math.round(Math.max(0, Math.min(1, Sound.vol + d)) * 100) / 100;
  Sound.setVol(v); showVol();
  const s = document.querySelector("#vol"); if (s) s.value = v;
  toast(v === 0 ? "🔇 Tắt tiếng" : `🔊 Âm lượng ${Math.round(v * 100)}%`);
}
$("#volUp").onclick = () => stepVol(0.1);
$("#volDown").onclick = () => stepVol(-0.1);
showVol();

function ytLoad(slot, input) {
  const id = ytIdFrom(input);
  if (!id) { toast("Link YouTube không đúng 🤔"); return false; }
  send({t: "media", slot, a: "load", id}); return true;
}

// ================== NETWORK ==================
function connect() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  ws = new WebSocket(url);
  // Vào lại sau khi mất mạng: quay về đúng khu/kênh/phòng đang ở
  const back = joined && inst ? {area: inst.area, ch: inst.ch || undefined, room: inst.code || dormCode} : {area: wantKind, room: dormCode, ch: wantCh};
  ws.onopen = () => send({t: "join", token, name: myName, color: myColor, pet: myPet, ...back,
                          lv: Life.level(), outfit: Areas.outfit(), legacy: token ? undefined : Life.legacy()});
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => {
    endTravel();
    if (kicked) return;                          // tài khoản đã vào ở nơi khác: không tự vào lại
    if (!joined && !wantReconnect) { $("#lobbyErr").textContent = "Không kết nối được server 😢"; return; }
    toast("Mất kết nối… đang vào lại");
    wantReconnect = true; setTimeout(connect, 2000);
  };
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
// Chế độ phát triển: nhớ khu/kênh đang ở rồi tải lại trang, trang mới tự vào lại đúng chỗ đó
let bootId = null;
function devReload() {
  try {
    if (joined && inst) sessionStorage.setItem("nc_dev_back", JSON.stringify({area: inst.area, ch: inst.ch || 0, room: inst.code || dormCode}));
  } catch (e) {}
  location.reload();
}

function addPlayer(d) {
  const p = {...d, tx: d.x, ty: d.y, lying: false, walking: false, up: false, bubble: null, emote: null};
  if (p.pet && p.pet.type !== "none" && PETS[p.pet.type])
    p.petObj = {x: p.x - 18, y: p.y + 3, dir: 1, walking: false, sleeping: false, side: -1, jumpAt: -9, hearts: [], nameUntil: 0};
  if (p.bed != null && seatIn(p.area, p.bed)) { const s = bedSpot(p.bed, p.area); p.x = p.tx = s.x; p.y = p.ty = s.y; p.lying = true; }
  players.set(p.id, p);
  return p;
}

function handle(m) {
  switch (m.t) {
    case "auth": {                                 // đăng nhập xong: nhận playerId + dữ liệu nhân vật từ server
      myUid = m.uid;
      if (m.token) { token = m.token; localStorage.setItem("ncn_token", token); }
      Life.setData(m.data);
      Life.S().outfit = {...(Life.S().outfit || {}), gender: myGender};   // giới tính chọn ở màn hình vào game
      if (m.migrated) { Life.dropLegacy(); setTimeout(() => toast("☁️ Đã chuyển dữ liệu cũ lên server"), 1500); }
      else if (Life.legacy()) Life.dropLegacy();   // đã có dữ liệu trên server thì bỏ bản cũ
      send({t: "lv", lv: Life.level()}); send({t: "outfit", outfit: Areas.cleanOutfit()});
      pendingDaily = m.daily || 0;                 // quà mỗi ngày do server cộng
      break;
    }
    case "reload": devReload(); break;              // chế độ phát triển: vừa sửa file giao diện
    case "welcome": {                              // vào một khu (lần đầu, khi chuyển khu, hoặc khi kết nối lại)
      if (m.boot) {                                // chế độ phát triển: server vừa khởi động lại (sửa .py/catalog) → tải bản mới
        if (bootId && m.boot !== bootId) { devReload(); break; }
        bootId = m.boot;
      }
      const first = !joined;
      myId = m.id; joined = true; wantReconnect = false;
      inst = m.inst; online = {counts: m.counts || {}, chans: m.chans || {}};
      if (inst.area === "sleep") { dormCode = inst.code; localStorage.setItem("nc_dorm", dormCode); }
      players.clear();
      m.state.players.forEach(addPlayer);
      clockOff = m.state.now - Date.now() / 1000;
      areas = m.state.areas; pomo = m.state.pomo;
      Areas.setHome(m.state.home);
      setArea(inst.area);
      if (m.state.pet) { setRoomPet(m.state.pet); roomPet.x = roomPet.tx; roomPet.y = roomPet.ty; }
      endTravel();
      $("#roomCode").textContent = `${AREA_NAME[inst.area].split(" ")[0]} ${instLabel()}`;
      log(`${first ? `Chào <b>${esc(myName)}</b>! ` : ""}` + ({study: "Chạm vào bàn để ngồi học 📚, bấm 🍅 để bật Pomodoro",
        park: "Đây là công viên trung tâm 🌳. Chạm 🚪 cổng hoặc bảng bản đồ (hoặc bấm 🗺️) để đi tới khu khác", sleep: `Phòng ngủ <b>${esc(inst.code)}</b> 🛏️: chạm vào giường để đi ngủ. Gửi mã phòng cho bạn bè để ngủ cùng nhé!`,
        cinema: "Chạm màn chiếu để chọn phim 🎬, chạm ghế để ngồi xem 🍿"}[myArea] || Areas.TXT[myArea].hello));
      if (!park()) log(`🚪 Muốn đi khu khác: đi tới lối ra hoặc bấm 🗺️`);
      if (first) {
        Quick.show();                                   // thanh nhanh (nút tròn bên phải)
        $("#lobby").classList.add("hidden");
        document.body.classList.add("ingame");
        ["#top", "#hud"].forEach(s => $(s).classList.remove("hidden"));
        resize();
        if (players.size === 1) log(`🐾 Mèo <b>Mun</b> sẽ đi dạo cùng bạn. Chạm để vuốt ve nhé!`);
        Life.onJoin(pendingDaily); Areas.onJoin(); pendingDaily = 0;
      }
      updateUI();
      break;
    }
    case "online": online = {counts: m.counts || {}, chans: m.chans || {}}; if (m.now) clockOff = m.now - Date.now() / 1000; break;
    case "eco": Life.onEco(m); break;              // server trả kết quả giao dịch / số dư mới
    case "kicked":
      kicked = true; joined = false;
      $("#lobby").classList.remove("hidden");
      $("#lobbyErr").textContent = m.msg + ". Tải lại trang để chơi tiếp ở máy này.";
      break;
    case "join": addPlayer(m.p); log(`<b>${esc(m.p.name)}</b> vừa tới đây 👋`); updateUI(); break;
    case "leave": log(`<b>${esc(nameOf(m.id))}</b> đã rời khu này`); players.delete(m.id); updateUI(); break;
    case "move": {
      const p = players.get(m.id); if (!p) break;
      if (p.bed != null) {          // thức dậy / đứng dậy khỏi bàn
        if (p.sat_at) { p.studied = (p.studied || 0) + serverNow() - p.sat_at; p.sat_at = null; }
        const s = bedSpot(p.bed, p.area);
        p.x = s.x; p.y = standUpY(p.area, p.bed);
        p.bed = null; p.lying = false;
      }
      if (!(m.id === myId && performance.now() / 1000 - lastSteer < .4)) { p.tx = m.x; p.ty = m.y; }
      updateUI(); break;
    }
    case "sleep": {
      const p = players.get(m.id); if (!p) break;
      if (p.lying && p.bed != null) { const s = bedSpot(p.bed, p.area); p.x = s.x; p.y = standUpY(p.area, p.bed); }
      if (p.sat_at) p.studied = (p.studied || 0) + m.at - p.sat_at;
      p.sat_at = p.area === "study" ? m.at : null;
      p.bed = m.bed; p.lying = false;
      const s = bedSpot(m.bed, p.area); p.tx = s.x; p.ty = s.y;
      updateUI(); break;
    }
    case "media": {
      clockOff = m.now - Date.now() / 1000;
      const A = areas[m.area];
      A.media[m.slot] = m.media;
      if (m.slot === "tv") {
        if (m.a === "load" || m.a === "sched") A.tv = {on: true, ch: -1};
        if (m.a === "stop") { A.tv.on = false; A.tvTimer = null; }
      } else if (m.a === "load") A.music.on = false;
      if (m.area !== myArea) break;
      if (m.slot === "tv") { tvSwitchAt = performance.now() / 1000; if (m.a === "stop") tvTimerEnd = null; }
      else if (m.a === "load") { syncMusic(); $("#ytMusic").classList.remove("mini"); }
      const where = m.slot === "tv" ? "trên TV" : "trên radio";
      applyMedia(m.slot);
      log(`<b>${esc(m.by)}</b> ${{load: "mở YouTube", pause: "tạm dừng YouTube", play: "tiếp tục YouTube", stop: "tắt YouTube", sched: "chiếu phim theo lịch 🎬"}[m.a]} ${where}`);
      updateUI(); break;
    }
    case "roompet": setRoomPet(m.pet); break;
    case "pomo": {
      clockOff = m.now - Date.now() / 1000; pomo = m.pomo;
      if (myArea !== "study") break;                 // không làm phiền người đang ngủ
      if (m.a === "switch") {
        Sound.chime(pomo.phase);
        const msg = pomo.phase === "break" ? `☕ Hết giờ học! Nghỉ ${pomo.brk} phút nào` : `📚 Hết giờ nghỉ, vào học thôi! (hiệp ${pomo.round})`;
        toast(msg); log(msg);
      } else {
        log(`<b>${esc(m.by)}</b> ` + {start: "bắt đầu Pomodoro ▶", pause: "tạm dừng Pomodoro ⏸", reset: "đặt lại Pomodoro ↺",
          set: `đổi Pomodoro thành ${pomo.focus}/${pomo.brk} phút`}[m.a]);
      }
      break;
    }
    case "status": { const p = players.get(m.id); if (p) p.status = m.text; break; }
    case "lv": { const p = players.get(m.id); if (p) p.lv = m.lv; break; }
    case "outfit": { const p = players.get(m.id); if (p) p.outfit = m.outfit; break; }
    case "home": Areas.setHome(m.items); break;
    case "pet": {                                   // đổi thú cưng (tiệm thú cưng)
      const p = players.get(m.id); if (!p) break;
      p.pet = m.pet;
      p.petObj = m.pet.type !== "none" && PETS[m.pet.type] ? {x: p.x - 18, y: p.y + 3, dir: 1, walking: false, sleeping: false, side: -1, jumpAt: -9, hearts: [], nameUntil: 0} : null;
      break;
    }
    case "pat": {
      const now = performance.now() / 1000;
      let pet, type, name, owner = null;
      if (m.target === "room") { pet = roomPet; type = "cat"; name = ROOM_PET.name; }
      else {
        owner = players.get(m.target); if (!owner || !owner.petObj) break;
        pet = owner.petObj; type = owner.pet.type; name = owner.pet.name;
      }
      if ((owner ? owner.area : roomPet.area) !== myArea) break;
      pet.jumpAt = now; pet.nameUntil = now + 2.5; pet.patBy = m.by;
      for (let i = 0; i < 3; i++) pet.hearts.push({t0: now + i * 0.15, dx: (Math.random() - .5) * 14});
      Sound.petSound(type);
      break;
    }
    case "tvtimer":
      if (m.now) clockOff = m.now - Date.now() / 1000;
      areas[m.area].tvTimer = m.end;
      if (m.area !== myArea) break;
      tvTimerEnd = m.end;
      if (m.end) log(`<b>${esc(m.by)}</b> hẹn tắt TV sau ${Math.round((m.end - m.now) / 60)} phút ⏰`);
      else if (!m.silent && m.by !== "⏰ Hẹn giờ") log(`<b>${esc(m.by)}</b> đã hủy hẹn giờ tắt TV`);
      break;
    case "tv": {
      const A = areas[m.area];
      A.tv = m.tv; A.media.tv = null;
      if (m.area !== myArea) break;
      tvSwitchAt = performance.now() / 1000; applyMedia("tv");
      log(m.tv.on ? `<b>${esc(m.by)}</b> mở TV: ${TV_CH[m.tv.ch].name}` : `<b>${esc(m.by)}</b> đã tắt TV`);
      updateUI(); break;
    }
    case "music": {
      const A = areas[m.area];
      A.music = m.music; if (m.music.on) A.media.music = null;
      if (m.area !== myArea) break;
      syncMusic(); applyMedia("music");
      log(m.music.on ? `<b>${esc(m.by)}</b> bật nhạc: ${TRACKS[m.music.track]}` : `<b>${esc(m.by)}</b> đã tắt nhạc`);
      updateUI(); break;
    }
    case "light":
      areas[m.area].light = m.on;
      if (m.area !== myArea) break;
      log(park() ? `<b>${esc(m.by)}</b> chuyển sang ${m.on ? "ban ngày ☀️" : "ban đêm 🌙"}`
        : m.on ? `<b>${esc(m.by)}</b> bật đèn 💡` : `<b>${esc(m.by)}</b> tắt đèn… chúc ngủ ngon 🌙`);
      updateAmbience(); updateUI(); break;
    case "chat": {
      const p = players.get(m.id); if (!p) break;
      p.bubble = {text: m.text, until: performance.now() / 1000 + 6};
      log(`<b>${esc(p.name)}${p.area !== myArea ? " (" + AREA_NAME[p.area].split(" ")[0] + ")" : ""}:</b> ${esc(m.text)}`); break;
    }
    case "emote": { const p = players.get(m.id); if (p) p.emote = {e: m.e, until: performance.now() / 1000 + 3, at: performance.now() / 1000}; break; }
    case "bc": case "stk": case "dt": case "announce": case "pinfo":   // 3 khu mới (zones.js)
      if (m.t === "dt" && m.a === "needAge") endTravel();
      Zones.onMsg(m); break;
    case "error":
      if (m.go) endTravel();                       // không chuyển khu được (đầy, đang ở đây…)
      if (!joined) $("#lobbyErr").textContent = m.msg; else toast(m.msg);
      break;
  }
}

function setArea(a) {
  myArea = roomKind = wantKind = a;
  applyLayout(a);
  if (lastPet) setRoomPet(lastPet);
  const A = areas[a];
  room = A; media = A.media; tvTimerEnd = A.tvTimer || null;
  lightLevel = room.light ? 0 : 1; lastPill = ""; tvBig = false; pendingDoor = false;
  document.body.classList.toggle("study", study());
  $("#pomoPill").classList.toggle("hidden", !study());
  history.replaceState(null, "", "?" + inviteQuery());
  syncMusic(); applyMedia("tv"); applyMedia("music"); placeTV();
  $("#thTitle").textContent = cinema() ? "Màn chiếu đang tắt" : "Phim chỉ chiếu ở 🎬 Phòng chiếu phim";
  $("#thSub").textContent = cinema() ? "Chạm để bật phim hoặc mở YouTube" : "Chạm để đi sang đó";
  updateAmbience();
  Life.onArea(a); Areas.onArea(a); Zones.onArea(a);
  updateUI();
}
function updateAmbience() {
  Sound.setNight(myArea === "sleep" && !room.light);
  Sound.ambient(myArea === "sleep" ? "fire" : outdoor() ? (Life.isDay() ? "day" : "night") : null);
}
function goDoor(d) {
  const m = me(); if (!m) return;
  pendingDoor = d;
  taps.push({x: d.spot.x, y: d.spot.y, t: performance.now() / 1000});
  send({t: "move", x: d.spot.x, y: d.spot.y});
}

function openSheet(title, html, bind) {

$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

function ytControls(slot) {
  const m = media[slot];
  return `<div class="ytrow"><input id="ytIn" placeholder="Dán link YouTube…" inputmode="url" autocomplete="off"><button id="ytGo">▶ Phát</button></div>
    ${m ? `<div class="grid"><button class="opt" id="ytPP">${m.paused ? "▶ Tiếp tục" : "⏸ Tạm dừng"}</button>
      ${slot === "tv" ? (theater ? "" : `<button class="opt" id="ytBig">${tvBig ? "🗗 Thu nhỏ" : "⛶ Xem to"}</button>`) :`<button class="opt" id="ytStop">⏹ Tắt YouTube</button>`}</div>` : ""}`;

function bindYt(el, slot) {
  const go = () => { if (ytLoad(slot, el.querySelector("#ytIn").value)) closeSheet(); };
  el.querySelector("#ytGo").onclick = go;
  el.querySelector("#ytIn").onkeydown = e => { if (e.key === "Enter") go(); };

  const big = el.querySelector("#ytBig"); if (big) big.onclick = () => { tvBig = !tvBig; placeTV(); closeSheet(); };
  const stop = el.querySelector("#ytStop"); if (stop) stop.onclick = () => { send({t: "media", slot, a: "stop"}); closeSheet(); };
}
// Giao diện menu chọn phim rạp (phim đang chiếu, danh sách phim cuộn ngang, lịch chiếu hôm nay)
function cinemaSectionHtml() {
  const sched = getCinemaSched();
  const isSched = !!(media.tv && media.tv.sched);
  const activeFilm = (media.tv && FILMS.find(f => f.id === media.tv.id)) || (sched ? sched.film : FILMS[0]);
  const pos = (media.tv && media.tv.id === activeFilm.id) ? mediaPos(media.tv) : (sched ? sched.pos : 0);
  const progressPct = Math.min(100, Math.max(0, (pos / activeFilm.len) * 100));

  const next6 = [];
  if (sched) {
    let tCursor = sched.startTime;
    for (let s = 0; s < 6; s++) {
      const idx = (sched.index + s) % FILMS.length;
      const f = FILMS[idx];
      const d = new Date(tCursor * 1000);
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      next6.push({
        film: f,
        timeStr: `${hh}:${mm}`,
        isNow: s === 0
      });
      tCursor += f.len;
    }
  }

  return `
    <div class="sec">Phim của rạp</div>
    <!-- Thẻ Phim đang chiếu -->
    <div class="cin-now">
      <img class="cin-now-thumb" src="/static/posters/${activeFilm.id}.svg" alt="${esc(activeFilm.title)}">

let scale = 1, ox = 0, oy = 0, dpr = 1, vw = 0, vh = 0;
// Chạm / nhấp vào điểm (x, y) của thế giới. walk = true: chạm sàn trống thì đi tới đó.
// noPet = true: bỏ qua thú cưng (để phím E ưu tiên đồ vật/NPC trước). Trả về true nếu đã làm gì đó.
function tapAt(x, y, walk, noPet) {
  const m = me(); if (!m) return false;
  pendingDoor = false;
  const hitPet = o => Math.hypot(x - o.x, y - (o.y - 10)) < 16;    // vuốt ve thú cưng
  if (!noPet) {
    for (const p of here()) if (p.petObj && hitPet(p.petObj)) { send({t: "pat", target: p.id}); return true; }
    if (roomPet.area === myArea && hitPet(roomPet)) { send({t: "pat", target: "room"}); return true; }
  }
  for (const d of doorsHere()) if (inRect(x, y, d, 10)) { if (walk) goDoor(d); else openMap(); return true; }
  if (park() && inRect(x, y, MAPBOARD, 6)) { openMap(); return true; }
  if (Areas.tap(x, y)) return true;                               // NPC trước (kể cả NPC 3 khu mới)
  if (Zones.has(myArea) && Zones.tap(x, y)) return true;          // bàn bầu cua, máy gắp, bảng điện, hồ đèn…                               // NPC, ô ruộng, cửa hàng, nội thất…
  if (cinema()) for (const it of LOBBY_ITEMS) if (inRect(x, y, it, 4)) { it.act(); return true; }
  if (inRect(x, y, SWITCH, 10)) { if (outdoor()) Life.openClock(); else send({t: "light", on: !room.light}); return true; }
  if (TVR && inRect(x, y, TVR, 4)) { openTV(); return true; }
  if (inRect(x, y, RADIO, 8)) { if (park()) Life.openParkShop(); else openMusic(); return true; }   // công viên: xe kem
  for (let i = 0; i < BEDS.length; i++) {
    if (inRect(x, y, {...BEDS[i], w: BED_W, h: BED_H})) {
      const o = bedOwner(i);
      if (o && o.id !== myId) { toast({study: `Bàn của ${o.name} rồi 📚`, park: `Ghế của ${o.name} rồi 🪑`, cinema: `Ghế của ${o.name} rồi 🍿`, sleep: `Giường của ${o.name} rồi 😴`}[myArea] || `${Areas.TXT[myArea].taken} ${o.name} rồi`); return true; }
      if (!o) { if (Life.canSit(i)) send({t: "sleep", bed: i}); return true; }
      return true; // giường của mình
    }
  }
  if (!walk) return false;
  const tx = Math.max(FLOOR.x1, Math.min(FLOOR.x2, x)), ty = Math.max(LAYOUT.minY || FLOOR.y1, Math.min(FLOOR.y2, y));   // hồ câu: không đi xuống nước
  taps.push({x: tx, y: ty, t: performance.now() / 1000});
  send({t: "move", x: tx, y: ty});
  return true;
}

// ---------- Tương tác (phím E / nút E): làm việc với vật gần nhất ----------
function interact() {
  const m = me(); if (!m || !joined) return;
  Sound.ensure();
  if (m.bed != null) { toggleSleep(); return; }                  // đang ngồi/nằm → đứng dậy
  for (const d of doorsHere()) if (Math.hypot(m.x - d.spot.x, m.y - d.spot.y) < 60) { openMap(); return; }
  const pts = [];                                                 // dò các điểm quanh nhân vật, gần trước xa sau
  for (const r of [0, 22, 44, 66, 88]) for (let k = 0; k < (r ? 8 : 1); k++) {
    const a = k * Math.PI / 4;
    for (const dy of [-20, 0]) pts.push([m.x + Math.cos(a) * r, m.y + dy + Math.sin(a) * r * .8]);
  }
  for (const noPet of [true, false]) for (const [x, y] of pts) if (tapAt(x, y, false, noPet)) return;
  toast("Không có gì để tương tác ở gần đây 🤔");
}

// ---------- Di chuyển liên tục: bàn phím (←→↑↓ / WASD) + cần ảo ----------
const keys = new Set();
let joyVec = {x: 0, y: 0}, steering = false, steerSent = 0, lastSteer = -9, doorLatch = false;
function inputDir() {
  if (!$("#sheet").classList.contains("hidden")) return null;    // đang mở bảng thì không đi
  let x = joyVec.x, y = joyVec.y;
  if (keys.has("left")) x -= 1; if (keys.has("right")) x += 1;
  if (keys.has("up")) y -= 1; if (keys.has("down")) y += 1;
  const d = Math.hypot(x, y);
  if (d < .2) return null;
  const k = Math.min(1, d) / d;
  return {x: x * k, y: y * k};
}
function steer(t) {
  const m = me(); if (!m || !joined) return;
  const dir = inputDir();
  if (!dir) {
    if (steering) {                                               // thả phím: dừng ngay tại chỗ
      steering = false; lastSteer = t;
      m.tx = m.x; m.ty = m.y;
      send({t: "move", x: Math.round(m.x), y: Math.round(m.y)});
    }
    return;
  }
  steering = true; pendingDoor = false; lastSteer = t;
  const look = SPEED * .35;                                       // nhìn trước 0.35 giây để người khác thấy mượt
  const tx = Math.max(FLOOR.x1, Math.min(FLOOR.x2, m.x + dir.x * look));
  const ty = Math.max(LAYOUT.minY || FLOOR.y1, Math.min(FLOOR.y2, m.y + dir.y * look));
  m.tx = tx; m.ty = ty;
  if (t - steerSent > .12) { steerSent = t; send({t: "move", x: Math.round(tx), y: Math.round(ty)}); }
  // đi vào lối ra → tự mở bản đồ (1 lần cho tới khi đi ra khỏi cửa)
  const atDoor = doorsHere().some(d => inRect(m.x, m.y, d, 4));
  if (atDoor && !doorLatch) openMap();
  doorLatch = atDoor;
}
const KEYMAP = {ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right",
                ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down"};

  else if (e.key === "i" || e.key === "I") Quick.act("bag");            // I: túi đồ
  else if (e.key === "l" || e.key === "L") Quick.act("rank");           // L: xếp hạng

  else if (e.key === "Escape") closeSheet();
  else if (/^[1-6]$/.test(e.key) && !sheetOpen) send({t: "emote", e: EMOTES[+e.key - 1]});

// Cần điều khiển ảo (điện thoại / máy tính bảng)
(function joystick() {
  const joy = $("#joy"), knob = $("#joyKnob");
  let pid = null;
  const moveTo = e => {
    const r = joy.getBoundingClientRect(), R = r.width / 2, max = R * .62;
    let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
    const d = Math.hypot(dx, dy); if (d > max) { dx *= max / d; dy *= max / d; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    joyVec = {x: dx / max, y: dy / max};
  };
  const end = e => { if (e.pointerId !== pid) return; pid = null; joyVec = {x: 0, y: 0}; knob.style.transform = ""; joy.classList.remove("on"); };
  joy.addEventListener("pointerdown", e => { e.preventDefault(); Sound.ensure(); pid = e.pointerId; joy.setPointerCapture(pid); joy.classList.add("on"); moveTo(e); });
  joy.addEventListener("pointermove", e => { if (e.pointerId === pid) moveTo(e); });
  joy.addEventListener("pointerup", end); joy.addEventListener("pointercancel", end);
})();

// Khung NGANG 1280x720 scale vừa màn hình (FIT). Không có viền đen: phần dư được vẽ tiếp nền (bleed).
let stageScale = 1, hudTop = 52, hudBot = 76;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, typeof Power !== "undefined" && Power.on() ? 1 : 2);   // tối đa 2x; tiết kiệm pin: 1x
  const vv = window.visualViewport;
  vw = window.innerWidth; vh = window.innerHeight;
  for (const c of [canvas, dark]) { c.width = Math.round(vw * dpr); c.height = Math.round(vh * dpr); }
  canvas.style.width = vw + "px"; canvas.style.height = vh + "px";
  stageScale = Math.min(vw / STAGE_W, vh / STAGE_H);
  const small = vh <= 460;
  hudTop = small ? 46 : 52; hudBot = small ? 66 : 74;              // chiều cao thanh trên / hàng nút dưới (px)
  theater = null;
  updateView(true);
  placeTheater(); placeTV();
}
// Tính phép biến đổi thế giới → màn hình (scale, ox, oy) cho khu hiện tại + camera
function updateView(snap, dt = 0) {
  // Mọi khu cùng tỉ lệ (720 đơn vị thế giới = 1280px khung) để nhân vật luôn to như nhau.
  // Thế giới rộng hơn màn hình thì camera đi theo nhân vật; hẹp hơn (khu dọc cũ) thì đặt giữa, chỉ cuộn dọc.
  scale = stageScale * STAGE_W / VIEW_W;
  const visW = vw / scale, visH = vh / scale, m = me();
  const padT = hudTop / scale, padB = hudBot / scale;             // cho camera kéo cảnh ra khỏi thanh trên / hàng nút dưới
  const fx = m ? m.x : W / 2, fy = m ? m.y : H / 2;
  const tx = W > visW ? Math.max(0, Math.min(W - visW, fx - visW / 2)) : (W - visW) / 2;
  // nhân vật đứng ở khoảng 60% chiều cao màn hình để thấy được tường/cửa sổ/lò sưởi phía trên
  let ty = H + padB + padT > visH ? Math.max(-padT, Math.min(H - visH + padB, fy - visH * .6)) : (H - visH) / 2;
  // ngồi ghế rạp phim: camera kéo lên để thấy trọn màn chiếu (camera gần thì màn chiếu bị cắt mất)
  if (myArea === "cinema" && m && m.lying && TVR) ty = Math.min(ty, TVR.y - padT - 6);
  if (snap || cam.snap) { cam.x = tx; cam.y = ty; cam.snap = false; }
  else { const k = Math.min(1, dt * 6); cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; }
  ox = -cam.x * scale; oy = -cam.y * scale;
  VIEW = {x0: -ox / scale, y0: -oy / scale, x1: (vw - ox) / scale, y1: (vh - oy) / scale};
}

// Phần thế giới đang thấy, nới rộng ra để vẽ nền tràn (không để hở viền khi màn hình rộng)
function bleed() {
  return {L: Math.min(-60, VIEW.x0 - 20), R: Math.max(W + 60, VIEW.x1 + 20), T: Math.min(-400, VIEW.y0 - 20), B: Math.max(H + 60, VIEW.y1 + 20)};
}
function drawWoodFloor(c0, c1, c2) {
  const {L, R, B} = bleed();
  ctx.fillStyle = c0; ctx.fillRect(L, 160, R - L, B - 160);
  for (let y = 160, i = 0; y < B; y += 22, i++) {
    ctx.fillStyle = i % 2 ? c1 : c2; ctx.fillRect(L, y, R - L, 22);
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(L, y, R - L, 1);
    for (let x = Math.floor(L / 120) * 120 + (i * 73) % 120; x < R; x += 120) ctx.fillRect(x, y, 1, 22);
  }
}
function drawWall(color) {
  const {L, R, T} = bleed();
  ctx.fillStyle = color; ctx.fillRect(L, T, R - L, 165 - T);
  ctx.fillStyle = "rgba(255,255,255,.03)";
  for (let x = Math.floor(L / 24) * 24; x < R; x += 24) ctx.fillRect(x, T, 12, 160 - T);
}
function drawClock(cx, cy) {
  const now = new Date();
  ctx.fillStyle = "#f4ead5"; ctx.beginPath(); ctx.arc(cx, cy, 15, 0, 7); ctx.fill();
  ctx.strokeStyle = "#8a5a3c"; ctx.lineWidth = 3; ctx.stroke();
  const hand = (a, len, w) => { ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(a) * len, cy - Math.cos(a) * len); ctx.stroke(); };
  ctx.strokeStyle = "#2a2a2a"; ctx.lineCap = "round";
  hand((now.getHours() % 12 + now.getMinutes() / 60) / 12 * Math.PI * 2, 7, 2);
  hand(now.getMinutes() / 60 * Math.PI * 2, 11, 1.5);
  ctx.strokeStyle = "#e05"; hand(now.getSeconds() / 60 * Math.PI * 2, 12, .8);
}

  ctx.fillStyle = room.music.on ? "#ffd27a" : "#7a6a55"; ctx.fillRect(R.x + 27, R.y + 6 - bounce, 16, 6);

}

// ---- 🛏️ ký túc xá ấm cúng ----
const BED_STYLE = [
  {c: "#f4a6b8", p: "stars"}, {c: "#a8d8ea", p: "clouds"}, {c: "#3d5a80", p: "moons"}, {c: "#c9a27e", p: "bears"},
  {c: "#f6d186", p: "cats"}, {c: "#b8e0b2", p: "flowers"}, {c: "#cdb4db", p: "dots"}, {c: "#ffb4a2", p: "stripes"},
];
const PLUSH = ["#c68b59", "#f3f0ea", "#f4a261", "#9b8cff", "#ffd166", "#90be6d", "#ff8fab", "#8d99ae"];
function patternAt(kind, x, y, w, h) {
  ctx.save(); rr(ctx, x, y, w, h, 6); ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2;
  for (let yy = y + 8; yy < y + h; yy += 14) for (let xx = x + 6 + ((yy - y) / 14 % 2) * 7; xx < x + w; xx += 15) {
    ctx.beginPath();
    if (kind === "stars") { for (let k = 0; k < 5; k++) { const a = k * 2.513 - 1.57; ctx.lineTo(xx + Math.cos(a) * 3.5, yy + Math.sin(a) * 3.5); } ctx.fill(); }
    else if (kind === "clouds") { ctx.arc(xx, yy, 2.6, 0, 7); ctx.arc(xx + 3.5, yy - 1, 3, 0, 7); ctx.arc(xx + 7, yy, 2.4, 0, 7); ctx.fill(); }
    else if (kind === "moons") { ctx.fillStyle = "#ffe8a3"; ctx.arc(xx, yy, 3.5, 0, 7); ctx.fill(); ctx.fillStyle = BED_STYLE[2].c; ctx.beginPath(); ctx.arc(xx + 1.8, yy - 1, 3, 0, 7); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.55)"; }
    else if (kind === "bears") { ctx.arc(xx, yy, 3, 0, 7); ctx.arc(xx - 2.6, yy - 2.6, 1.4, 0, 7); ctx.arc(xx + 2.6, yy - 2.6, 1.4, 0, 7); ctx.fill(); }
    else if (kind === "cats") { ctx.arc(xx, yy, 3, 0, 7); ctx.moveTo(xx - 3, yy - 1); ctx.lineTo(xx - 2.5, yy - 5); ctx.lineTo(xx, yy - 2.5); ctx.lineTo(xx + 2.5, yy - 5); ctx.lineTo(xx + 3, yy - 1); ctx.fill(); }
    else if (kind === "flowers") { for (let k = 0; k < 5; k++) { const a = k * 1.256; ctx.moveTo(xx, yy); ctx.arc(xx + Math.cos(a) * 2.4, yy + Math.sin(a) * 2.4, 1.6, 0, 7); } ctx.fill(); ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(xx, yy, 1.2, 0, 7); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.55)"; }
    else if (kind === "dots") { ctx.arc(xx, yy, 2, 0, 7); ctx.fill(); }
  }
  if (kind === "stripes") for (let xx = x - h; xx < x + w; xx += 10) { ctx.beginPath(); ctx.moveTo(xx, y + h); ctx.lineTo(xx + h, y); ctx.stroke(); }
  ctx.restore();
}
function drawCozyBed(i, t) {
  const b = BEDS[i], o = bedOwner(i), lying = o && o.lying, st = BED_STYLE[i % 8];
  const x = b.x, y = b.y, w = BED_W, h = BED_H, cx = x + w / 2, br = lying ? Math.sin(t * 1.6 + i) * 1.2 : 0;
  // tên chủ giường (hiển thị khi có người đặt giường)
  if (o) label(o.name, cx, y - 24, "#ffd27a");
  // tủ đầu giường + đèn ngủ nấm / mặt trăng + ly nước + sách (bên trên đầu giường)
  ctx.fillStyle = "#8a5a3c"; rr(ctx, x + 1, y - 17, 24, 13, 2); ctx.fill();
  if (i % 2) { ctx.fillStyle = "#fff6c8"; ctx.beginPath(); ctx.arc(x + 8, y - 21, 4.5, 0, 7); ctx.fill(); ctx.fillStyle = "#8a5a3c"; ctx.beginPath(); ctx.arc(x + 10, y - 22, 3.6, 0, 7); ctx.fill(); }
  else { ctx.fillStyle = "#f3e9dc"; ctx.fillRect(x + 7, y - 21, 3, 5); ctx.fillStyle = "#e63946"; ctx.beginPath(); ctx.arc(x + 8.5, y - 21, 5, Math.PI, 0); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillRect(x + 6, y - 24, 1.5, 1.5); ctx.fillRect(x + 10, y - 23, 1.5, 1.5); }
  ctx.fillStyle = "rgba(160,210,255,.8)"; ctx.fillRect(x + 15, y - 22, 4, 6);
  ctx.fillStyle = ["#2a9d8f", "#e76f51", "#457b9d"][i % 3]; ctx.fillRect(x + 13, y - 14, 9, 3);
  // khung giường + nệm
  ctx.fillStyle = "rgba(0,0,0,.25)"; rr(ctx, x + 3, y + 4, w, h, 7); ctx.fill();
  ctx.fillStyle = "#7a5236"; rr(ctx, x, y, w, h, 7); ctx.fill();
  ctx.fillStyle = "#5e3d27"; rr(ctx, x - 2, y - 3, w + 4, 9, 3); ctx.fill();              // đầu giường
  ctx.fillStyle = "#f7f0e6"; rr(ctx, x + 4, y + 5, w - 8, h - 9, 6); ctx.fill();
  ctx.fillStyle = "#ffffff"; rr(ctx, cx - 15, y + 8, 30, 18, 7); ctx.fill();             // gối
  ctx.strokeStyle = "#e9dfd2"; ctx.lineWidth = 1; ctx.stroke();
  // chăn bông: đắp tới cổ khi đang ngủ, gấp gọn ở cuối giường khi trống
  const by = lying ? y + 25 : y + 52, bh2 = y + h - 5 - by;
  ctx.fillStyle = st.c; rr(ctx, x + 5, by - br * .5, w - 10, bh2 + br * .5, 7); ctx.fill();
  patternAt(st.p, x + 5, by - br * .5, w - 10, bh2 + br * .5);
  ctx.fillStyle = "rgba(255,255,255,.35)"; rr(ctx, x + 5, by - br * .5, w - 10, 7, 4); ctx.fill();
  if (lying) {                                                               // đầu người ngủ trên gối
    const hy = y + 17;
    ctx.fillStyle = "#f5d0a9"; ctx.beginPath(); ctx.arc(cx, hy, 9, 0, 7); ctx.fill();
    ctx.fillStyle = "#3b2a20"; ctx.beginPath(); ctx.arc(cx, hy - 2, 9.5, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = "#3b2a20"; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(cx - 3.5, hy + 1, 1.8, .3, Math.PI - .3); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + 3.5, hy + 1, 1.8, .3, Math.PI - .3); ctx.stroke();
    ctx.fillStyle = "rgba(255,120,140,.35)"; ctx.beginPath(); ctx.arc(cx - 6, hy + 4, 1.8, 0, 7); ctx.arc(cx + 6, hy + 4, 1.8, 0, 7); ctx.fill();
  }
  // thú bông (cạnh gối khi có người ngủ, ngồi trên nệm khi trống)
  const px = lying ? x + w - 11 : cx, py = lying ? y + 14 : y + 38;
  ctx.fillStyle = PLUSH[i % 8]; ctx.beginPath(); ctx.arc(px, py, 5.5, 0, 7); ctx.arc(px - 4, py - 4.5, 2.3, 0, 7); ctx.arc(px + 4, py - 4.5, 2.3, 0, 7); ctx.fill();
  ctx.fillStyle = "#2a1d16"; ctx.fillRect(px - 2.2, py - 1, 1.3, 1.3); ctx.fillRect(px + 1, py - 1, 1.3, 1.3);
  // rèm mỏng ở đầu giường (buông 2 bên)
  ctx.fillStyle = "rgba(255,244,235,.42)"; rr(ctx, x - 1, y - 2, 6, 34, 3); ctx.fill(); rr(ctx, x + w - 5, y - 2, 6, 34, 3); ctx.fill();
}

function drawFairyLights(t) {                     // dây đèn vàng chạy dọc trần và mép tường
  const on = room.light ? 1 : .55;
  const pts = [];
  for (let x = 4; x <= W - 4; x += 16) pts.push([x, 20 + Math.sin(x * .09) * 4]);
  for (let y = 180; y < 520; y += 22) { pts.push([4, y]); pts.push([W - 4, y]); }
  pts.forEach(([x, y], k) => {
    const a = on * (.55 + .45 * Math.sin(t * 2 + k * 1.3));
    const g = ctx.createRadialGradient(x, y, 0, x, y, 6);
    g.addColorStop(0, `rgba(255,214,120,${a})`); g.addColorStop(1, "rgba(255,214,120,0)");

  });
}

function drawMotivationalBanner(x, y, w, h, text) { // Băng rôn cổ động tinh thần học tập bằng tiếng Việt

  ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(x + 10, y - 6, 2, 0, 7); ctx.arc(x + w - 10, y - 6, 2, 0, 7); ctx.fill();

  ctx.fillStyle = "#6b1420";
  // Đuôi trái
  ctx.beginPath();
  ctx.moveTo(x + 6, y); ctx.lineTo(x - 8, y); ctx.lineTo(x - 2, midY); ctx.lineTo(x - 8, y + h); ctx.lineTo(x + 6, y + h);
  ctx.closePath(); ctx.fill();
  // Đuôi phải
  ctx.beginPath();
  ctx.moveTo(x + w - 6, y); ctx.lineTo(x + w + 8, y); ctx.lineTo(x + w + 2, midY); ctx.lineTo(x + w + 8, y + h); ctx.lineTo(x + w - 6, y + h);
  ctx.closePath(); ctx.fill();

  // Thân băng rôn màu đỏ thắm sang trọng
  const bg = ctx.createLinearGradient(0, y, 0, y + h);
  bg.addColorStop(0, "#a82032"); bg.addColorStop(1, "#851424");
  ctx.fillStyle = bg; rr(ctx, x, y, w, h, 3); ctx.fill();

  // Viền vàng kim tuyến trên dưới
  ctx.fillStyle = "#ffd166";
  ctx.fillRect(x + 2, y + 1.5, w - 4, 1.5);
  ctx.fillRect(x + 2, y + h - 3, w - 4, 1.5);

  ctx.fillStyle = "#fff8e7";
  ctx.font = "800 8.5px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";

}
