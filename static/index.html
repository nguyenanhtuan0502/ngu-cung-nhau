<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151229">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ngủ Cùng Nhau</title>
<style>
  :root{
    --bg:#0d0b1e; --panel:#1d1a38; --panel2:#2a2650; --text:#f3eefe; --muted:#a9a3c9;
    --accent:#ffd27a; --accent2:#9b8cff; --danger:#ff7a8a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;touch-action:none;display:block}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  .hidden{display:none!important}

  /* top bar */
  #top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
  .pill{pointer-events:auto;background:rgba(20,17,45,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
  #shareBtn{background:rgba(255,210,122,.18);border-color:rgba(255,210,122,.4)}

  #log{position:fixed;top:calc(46px + env(safe-area-inset-top));left:10px;max-width:70%;z-index:4;pointer-events:none;
    display:flex;flex-direction:column;gap:4px}
  #log div{background:rgba(10,8,25,.6);padding:4px 9px;border-radius:10px;font-size:12px;line-height:1.35;
    transition:opacity .8s;word-break:break-word;width:fit-content}
  #log b{color:var(--accent)}

  #together{position:fixed;left:50%;transform:translateX(-50%);top:calc(46px + env(safe-area-inset-top));z-index:4;
    background:rgba(40,30,90,.8);border:1px solid rgba(155,140,255,.5);padding:7px 14px;border-radius:999px;font-size:13px;
    box-shadow:0 0 24px rgba(155,140,255,.35);white-space:nowrap;animation:glow 3s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 36px rgba(155,140,255,.6)}}

  /* HUD */
  #hud{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px;z-index:5;padding:0 8px}
  #hud button{width:54px;height:56px;border-radius:16px;background:rgba(24,20,52,.82);border:1px solid rgba(255,255,255,.12);
    font-size:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .1s,background .2s}
  #hud button{padding:0}
  #hud button span{font-size:10px;color:var(--muted);white-space:nowrap}
  #hud button:active{transform:scale(.92)}
  #hud button.on{background:rgba(255,210,122,.22);border-color:rgba(255,210,122,.55)}
  #hud button.on span{color:var(--accent)}

  /* bottom sheet */
  #sheet{position:fixed;inset:0;z-index:20;background:rgba(5,4,15,.45);display:flex;align-items:flex-end;justify-content:center}
  .sheet-inner{width:100%;max-width:440px;background:var(--panel);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(255,255,255,.1);animation:up .22s ease-out;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  @keyframes up{from{transform:translateY(100%)}}
  .sheet-title{font-weight:700;margin-bottom:12px;font-size:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{background:var(--panel2);border-radius:14px;padding:13px 10px;font-size:14px;border:1px solid transparent;text-align:left}
  .opt.active{border-color:var(--accent);background:rgba(255,210,122,.15)}
  .opt.off{grid-column:1/-1;text-align:center;background:rgba(255,122,138,.15);color:#ffc2ca}
  .emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .emojis button{font-size:28px;background:var(--panel2);border-radius:14px;padding:8px 0}
  .vol{margin-top:14px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
  .vol input{flex:1;accent-color:var(--accent)}

  /* YouTube */
  #tvFrame{position:fixed;z-index:3;background:#000;overflow:hidden;pointer-events:none;border-radius:3px}
  #tvFrame iframe,#ytMusic iframe{width:100%;height:100%;border:0;display:block;pointer-events:none}
  .ythold{width:100%;height:100%}
  #tvFrame.big{z-index:15;pointer-events:auto;left:50%!important;top:calc(64px + env(safe-area-inset-top))!important;transform:translateX(-50%);
    width:min(96vw,760px)!important;height:auto!important;aspect-ratio:16/9;border-radius:12px;
    box-shadow:0 0 0 4px #121216,0 12px 60px rgba(0,0,0,.75),0 0 90px rgba(150,160,255,.25)}
  #tvShrink{display:none;position:absolute;right:6px;top:6px;z-index:2;background:rgba(0,0,0,.6);padding:5px 10px;border-radius:999px;font-size:12px}
  #tvFrame.big #tvShrink{display:block}
  #ytMusic{position:fixed;left:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;width:160px;background:rgba(20,17,45,.92);
    border:1px solid rgba(255,255,255,.14);border-radius:12px;overflow:hidden;cursor:pointer}
  #ytMusic .mframe{width:160px;height:90px;transition:height .2s}
  #ytMusic.mini .mframe{height:1px;opacity:.01}
  #ytMusic .mtitle{font-size:11px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
  #ytUnlock{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:25;padding:14px 20px;border-radius:999px;
    background:var(--accent);color:#2a1c00;font-weight:800;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.5);white-space:nowrap}
  .ytrow{display:flex;gap:6px;margin-bottom:10px}
  .ytrow input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--text);outline:none}
  .ytrow button{padding:0 14px;border-radius:12px;background:#ff3d3d;color:#fff;font-weight:700;white-space:nowrap}
  .sec{font-size:12px;color:var(--muted);margin:12px 2px 8px}
  .timers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .timers button{background:var(--panel2);border-radius:12px;padding:11px 0;font-size:14px;border:1px solid transparent}
  .timers button.cancel{grid-column:1/-1;background:rgba(255,122,138,.15);color:#ffc2ca}

  /* Âm lượng */
  #volCtl{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:16;display:flex;flex-direction:column;align-items:center;gap:6px;
    background:rgba(20,17,45,.72);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #volCtl button{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);font-size:20px;font-weight:800;line-height:1}
  #volCtl button:active{transform:scale(.9);background:rgba(255,210,122,.3)}
  #volPct{font-size:11px;color:var(--accent);font-weight:700;min-width:34px;text-align:center}

  /* Màn hình ngang: TV lớn bên trái, phòng bên phải */
  #sa{position:fixed;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #theater{position:fixed;z-index:2;background:#000;border-radius:12px;overflow:hidden;cursor:pointer;
    box-shadow:0 0 0 6px #121216,0 0 0 7px #2c2c36,0 20px 60px rgba(0,0,0,.6);transition:box-shadow .5s}
  #theater.glow{box-shadow:0 0 0 6px #121216,0 0 0 7px #2c2c36,0 0 90px rgba(150,160,255,.28)}
  #bigTV{width:100%;height:100%;display:block}
  #theaterOff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    color:var(--muted);font-size:34px;background:radial-gradient(ellipse at 30% 20%,#23262e,#0e1014)}
  #theaterOff div{font-size:15px;color:var(--text)}
  #theaterOff small{font-size:12px}
  #theaterTimer{position:fixed;z-index:4;background:rgba(0,0,0,.65);color:var(--accent);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;pointer-events:none}
  body.wide #hud{flex-direction:column;left:calc(8px + env(safe-area-inset-left));right:auto;top:50%;bottom:auto;transform:translateY(-50%);padding:0;gap:5px}
  body.wide #hud button{width:56px;height:48px;border-radius:14px;font-size:19px}
  body.wide #log{left:calc(var(--roomx) + 6px);max-width:calc(var(--roomw) - 12px)}
  body.wide #log div{font-size:10.5px;padding:3px 7px;background:rgba(10,8,25,.5)}
  body.wide #volCtl{transform:translateY(-50%) scale(.85);opacity:.85}
  body.wide #together{left:calc(var(--roomx) + var(--roomw) / 2);top:auto;bottom:12px;font-size:12px;white-space:normal;text-align:center;
    width:max-content;max-width:calc(var(--roomw) - 16px)}
  body.wide #chatBar{left:calc(76px + env(safe-area-inset-left));right:10px;bottom:10px;max-width:none;margin:0}
  body.wide #ytMusic{left:auto;right:calc(8px + env(safe-area-inset-right));bottom:10px}
  body.wide #toast{bottom:16px}

  #chatBar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:6px;max-width:440px;margin:0 auto}
  #chatBar input{flex:1;font-size:16px;padding:11px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(20,17,45,.95);color:var(--text);outline:none}
  #chatBar button{padding:0 16px;border-radius:999px;background:var(--accent);color:#2a1c00;font-weight:700}

  #toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);opacity:0;z-index:30;
    background:rgba(255,255,255,.95);color:#1a1530;padding:8px 14px;border-radius:999px;font-size:13px;transition:.25s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%)}

  /* lobby */
  #lobby{position:fixed;inset:0;z-index:50;display:flex;padding:20px;
    background:radial-gradient(ellipse at 50% 0%,#3a2f7a 0%,#151229 55%,#0a0816 100%);overflow:auto}
  .card{width:100%;max-width:360px;text-align:center;margin:auto}
  .logo{font-size:56px;animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px) rotate(-6deg)}}
  h1{margin:4px 0 2px;font-size:28px;letter-spacing:.5px}
  .sub{margin:0 0 20px;color:var(--muted);font-size:14px}
  .card label{display:block;text-align:left;font-size:12px;color:var(--muted);margin:12px 4px 6px}
  .card input{width:100%;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--text);outline:none}
  .card input:focus{border-color:var(--accent2)}
  #roomInput{text-transform:uppercase;letter-spacing:3px}
  #colors{display:flex;gap:8px;justify-content:space-between}
  #colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
  #colors button.sel{border-color:#fff;transform:scale(1.1)}
  .map{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .map .opt,.mapgate{text-align:center;padding:12px 4px;font-size:13px;display:flex;flex-direction:column;gap:2px;align-items:center}
  .map small,.mapgate small{font-size:10px;color:var(--muted)}
  .mapgate{background:rgba(255,255,255,.04);border-radius:14px;border:1px dashed rgba(255,255,255,.15)}
  /* Phòng học */
  #pomoPill{position:fixed;right:10px;top:calc(46px + env(safe-area-inset-top));z-index:5;font-weight:700;font-variant-numeric:tabular-nums}
  #pomoPill.focus{background:rgba(255,99,71,.28);border-color:rgba(255,120,100,.6)}
  #pomoPill.break{background:rgba(94,242,168,.2);border-color:rgba(94,242,168,.55)}
  #pomoPill.paused{opacity:.7}
  body.wide #pomoPill{right:auto;left:calc(var(--roomx) - 132px);top:calc(8px + env(safe-area-inset-top))}
  body.study:not(.wide) #together{top:calc(84px + env(safe-area-inset-top))}
  .pomoBig{text-align:center;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;margin:0 0 2px}
  .pomoSub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
  .timers button.cur{border-color:var(--accent);background:rgba(255,210,122,.15)}
  .board{display:flex;flex-direction:column;gap:4px;font-size:14px}
  .board div{display:flex;justify-content:space-between;gap:8px;background:var(--panel2);padding:8px 12px;border-radius:10px}
  .board small{color:var(--muted)}
  .board b{color:var(--accent);font-variant-numeric:tabular-nums}
  #pets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  #pets button{background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:14px;padding:8px 0 6px;font-size:24px;
    display:flex;flex-direction:column;align-items:center;gap:2px}
  #pets button span{font-size:11px;color:var(--muted)}
  #pets button.sel{border-color:var(--accent);background:rgba(255,210,122,.12)}
  #petName{margin-top:6px}
  .primary{width:100%;margin-top:18px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#ffd27a,#ffb36b);color:#2a1c00;font-weight:800;font-size:16px}
  .ghost{width:100%;margin-top:8px;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);font-size:15px}
  #lobbyErr{color:var(--danger);min-height:20px;font-size:13px}
  .stars-bg{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="hidden">
  <div class="pill">🏠 <b id="roomCode"></b> · 👥 <span id="count">1</span> · <span id="sleepIcon">😴</span> <span id="sleepCount">0</span></div>
  <div style="display:flex;gap:6px"><button class="pill" id="mapBtn">🗺️</button><button class="pill" id="shareBtn">🔗 Mời bạn</button></div>
</div>
<div id="log"></div>
<button id="pomoPill" class="pill hidden">🍅 25:00</button>
<div id="together" class="hidden"><span id="togetherText"></span> · <span id="togetherTime">00:00</span></div>

<div id="hud" class="hidden">
  <button data-a="sleep" id="sleepBtn">😴<span>Ngủ</span></button>
  <button data-a="light" id="lightBtn">💡<span>Đèn</span></button>
  <button data-a="tv" id="tvBtn">📺<span>TV</span></button>
  <button data-a="music" id="musicBtn">🎵<span>Nhạc</span></button>
  <button data-a="emote">😊<span>Biểu cảm</span></button>
  <button data-a="chat">💬<span>Chat</span></button>
</div>

<div id="chatBar" class="hidden"><input id="chatInput" maxlength="80" placeholder="Nhắn gì đó…" enterkeyhint="send"><button id="chatSend">Gửi</button></div>
<div id="sheet" class="hidden"><div class="sheet-inner"><div class="sheet-title"></div><div class="sheet-body"></div></div></div>
<div id="toast"></div>
<div id="tvFrame" class="hidden"><div class="ythold" id="tvHold"></div><button id="tvShrink">✕ Thu nhỏ</button></div>
<div id="ytMusic" class="hidden"><div class="mframe"><div class="ythold" id="musicHold"></div></div><div class="mtitle">▶️ <span id="mTitle">YouTube</span></div></div>
<div id="theater" class="hidden"><canvas id="bigTV"></canvas>
  <div id="theaterOff">🎬<div id="thTitle">Màn chiếu đang tắt</div><small id="thSub">Chạm để bật phim hoặc mở YouTube</small></div></div>
<div id="theaterTimer" class="hidden"></div>
<div id="sa"></div>
<div id="volCtl" class="hidden"><button id="volUp" aria-label="Tăng âm lượng">＋</button><div id="volPct">70%</div><button id="volDown" aria-label="Giảm âm lượng">－</button></div>
<button id="ytUnlock" class="hidden">🔊 Chạm để phát cùng mọi người</button>

<div id="lobby">
  <div class="card">
    <div class="logo">🌙</div>
    <h1>Ngủ Cùng Nhau</h1>
    <p class="sub">Vào phòng, bật TV, mở nhạc rồi cùng nhau ngủ ngon</p>
    <label>Tên của bạn</label>
    <input id="nameInput" maxlength="14" placeholder="VD: Mèo Mập" autocomplete="off">
    <label>Màu pyjama</label>
    <div id="colors"></div>
    <label>Thú cưng đi cùng</label>
    <div id="pets"></div>
    <input id="petName" maxlength="10" placeholder="Tên thú cưng (tuỳ chọn)" autocomplete="off">
    <label>Mã phòng</label>
    <input id="roomInput" maxlength="8" placeholder="VD: MEOW" autocomplete="off">
    <button id="joinBtn" class="primary">Vào phòng</button>
    <button id="newBtn" class="ghost">✨ Tạo thế giới mới (bắt đầu ở cổng công viên)</button>
    <p id="lobbyErr"></p>
  </div>
</div>

<script>
"use strict";
// ================== CONSTANTS ==================
const W = 360, H = 640;
const FLOOR = {x1: 16, y1: 175, x2: 344, y2: 575};
// Mỗi khu một bố cục riêng: chỗ nằm/ngồi, TV, radio, công tắc, nguồn sáng trăng
const LAYOUTS = {
  sleep: {                                   // ký túc xá ấm cúng: 8 giường 2 bên, lối đi giữa, lò sưởi
    beds: [{x: 8, y: 196}, {x: 252, y: 196}, {x: 8, y: 280}, {x: 252, y: 280},
           {x: 8, y: 364}, {x: 252, y: 364}, {x: 8, y: 448}, {x: 252, y: 448}],
    bw: 100, bh: 62,
    tvr: null, scr: null,
    radio: {x: 296, y: 82, w: 48, h: 28}, sw: {x: 214, y: 540, w: 13, h: 19}, moon: {x: 60, y: 62},
  },
  study: {                                   // phòng học: lớp học 3 dãy x 2 hàng, giá sách trái, bảng/TV phải
    beds: [{x: 6, y: 192}, {x: 125, y: 192}, {x: 244, y: 192}, {x: 6, y: 318}, {x: 125, y: 318}, {x: 244, y: 318}],
    bw: 110, bh: 95,
    tvr: null, scr: null,
    radio: {x: 302, y: 104, w: 48, h: 28}, sw: {x: 122, y: 74, w: 13, h: 19}, moon: null,
  },
  park: {                                    // công viên trung tâm: đài phun nước, 4 lối đi
    beds: [{x: 30, y: 212}, {x: 220, y: 212}, {x: 30, y: 384}, {x: 220, y: 384}],
    bw: 110, bh: 80,
    tvr: null, scr: null,
    radio: {x: 268, y: 296, w: 58, h: 34}, sw: {x: 44, y: 44, w: 36, h: 36}, moon: {x: 62, y: 62},
  },
  cinema: {                                  // rạp kiểu Nhật: phòng chiếu phía trong, sảnh ngay sau cửa
    beds: [{x: 14, y: 168}, {x: 125, y: 168}, {x: 236, y: 168}, {x: 14, y: 252}, {x: 125, y: 252}, {x: 236, y: 252}],
    bw: 110, bh: 80,
    tvr: {x: 30, y: 20, w: 300, h: 132}, scr: {x: 36, y: 26, w: 288, h: 120},
    radio: {x: 300, y: 498, w: 44, h: 26}, sw: {x: 341, y: 112, w: 13, h: 19}, moon: null,
  },
};
let BED_W = 110, BED_H = 95, BEDS = LAYOUTS.sleep.beds;
let TVR = LAYOUTS.sleep.tvr, SCR = LAYOUTS.sleep.scr, RADIO = LAYOUTS.sleep.radio, SWITCH = LAYOUTS.sleep.sw;
let LAYOUT = LAYOUTS.sleep;
function applyLayout(a) {
  LAYOUT = LAYOUTS[a];
  ({beds: BEDS, bw: BED_W, bh: BED_H, tvr: TVR, scr: SCR, radio: RADIO, sw: SWITCH} = LAYOUT);
}
const tvCenter = () => TVR ? {x: TVR.x + TVR.w / 2, y: TVR.y + TVR.h / 2} : {x: 180, y: 90};
// Cửa: góc trái/phải dưới nối 3 khu với nhau; thêm 1 cửa sang phòng chiếu phim
const DOOR_R = {x: 332, y: 513, w: 28, h: 62, side: "right", spot: {x: 336, y: 546}};
const DOOR_L = {x: 0, y: 513, w: 28, h: 62, side: "left", spot: {x: 24, y: 546}};
const AREA_DOORS = {
  park: [                                    // Bắc: phòng học · Tây: ký túc xá · Đông: phố rạp phim
    {x: 162, y: 110, w: 36, h: 52, side: "wall", spot: {x: 180, y: 182}, to: "study", custom: true},
    {x: 0, y: 318, w: 24, h: 76, side: "left", spot: {x: 22, y: 356}, to: "sleep", custom: true},

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function inRect(px, py, r, pad = 0) { return px >= r.x - pad && px <= r.x + r.w + pad && py >= r.y - pad && py <= r.y + r.h + pad; }
function srand(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.round(v + (255 - v) * amt);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

// ================== SOUND (WebAudio, không cần file nhạc) ==================
const Sound = {
  ctx: null, master: null, bus: null, timers: [], srcs: [], current: -1,
  vol: parseFloat(localStorage.getItem("nc_vol") || "0.7"),
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.vol;
      this.master.connect(this.ctx.destination);
      this.mix = this.ctx.createGain(); this.lp = this.ctx.createBiquadFilter();     // "ru ngủ" khi tắt đèn
      this.lp.type = "lowpass"; this.lp.frequency.value = 20000;
      this.mix.connect(this.lp); this.lp.connect(this.master);
      const b = this.ctx.createBuffer(1, 1, 22050), s = this.ctx.createBufferSource(); // unlock iOS
      s.buffer = b; s.connect(this.ctx.destination); s.start(0);
      this.white = this.noise(2, false); this.brown = this.noise(4, true);
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return true;
  },
  noise(sec, brown) {
    const c = this.ctx, len = c.sampleRate * sec, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
    }
    return buf;
  },
  setVol(v) {
    this.vol = v; localStorage.setItem("nc_vol", v);
    if (this.master) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05);
    for (const p of Object.values(YTP)) if (p && p.ready) p.pl.setVolume(Math.round(v * 100));
  },
  stop() {
    this.timers.forEach(clearInterval); this.timers = [];
    if (this.bus) {
      const bus = this.bus, srcs = this.srcs, c = this.ctx;
      bus.gain.cancelScheduledValues(c.currentTime);
      bus.gain.setTargetAtTime(0, c.currentTime, 0.35);
      setTimeout(() => { srcs.forEach(s => { try { s.stop(); } catch (e) {} }); bus.disconnect(); }, 2000);
    }
    this.bus = null; this.srcs = []; this.current = -1;
  },
  play(track) {
    if (!this.ctx || this.current === track) return;
    this.stop();
    const c = this.ctx, bus = c.createGain();
    bus.gain.value = 0; bus.gain.setTargetAtTime(1, c.currentTime, 0.6); bus.connect(this.mix);
    this.bus = bus; this.current = track;
    [this.lullaby, this.lofi, this.rain, this.waves][track].call(this, c, bus);
  },
  tone(dest, freq, t0, dur, type = "sine", g = 0.1, atk = 0.02) {
    const c = this.ctx, o = c.createOscillator(), a = c.createGain();
    o.type = type; o.frequency.value = freq;
    a.gain.setValueAtTime(0.0001, t0); a.gain.linearRampToValueAtTime(g, t0 + atk);
    a.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(a); a.connect(dest); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  burst(dest, t0, dur, g, type, freq) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), a = c.createGain();
    s.buffer = this.white; f.type = type; f.frequency.value = freq;
    a.gain.setValueAtTime(g, t0); a.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(a); a.connect(dest); s.start(t0, Math.random() * 1.5, dur + 0.05);
  },
  loop(buf, dest, g, filters) {
    const c = this.ctx, s = c.createBufferSource(), a = c.createGain();
    s.buffer = buf; s.loop = true; a.gain.value = g;
    let node = s;
    for (const [type, freq] of filters) { const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; node.connect(f); node = f; }
    node.connect(a); a.connect(dest); s.start(); this.srcs.push(s);
    return a;
  },
  seq(stepDur, fn) {
    const c = this.ctx; let next = c.currentTime + 0.15, step = 0;
    const tick = () => {
      if (next < c.currentTime) next = c.currentTime + 0.05;   // bị tụt (tab nền)
      while (next < c.currentTime + 1.2) { fn(step, next); next += stepDur; step++; }
    };
    tick(); this.timers.push(setInterval(tick, 200));
  },
  mtof: m => 440 * Math.pow(2, (m - 69) / 12),

  setNight(on) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.mix.gain.setTargetAtTime(on ? .5 : 1, t, 1.5);
    this.lp.frequency.setTargetAtTime(on ? 1300 : 20000, t, 1.5);
  },
  ambTimers: [], ambSrcs: [], ambBus: null, ambKind: undefined,
  ambient(kind) {                      // âm thanh nền: lửa lách tách + đồng hồ / chim hót / dế kêu
    if (!this.ctx || kind === this.ambKind) return;
    this.ambKind = kind;
    this.ambTimers.forEach(clearInterval); this.ambTimers = [];
    if (this.ambBus) { const b = this.ambBus, ss = this.ambSrcs, c = this.ctx; b.gain.setTargetAtTime(0, c.currentTime, .4); setTimeout(() => { ss.forEach(x => { try { x.stop(); } catch (e) {} }); b.disconnect(); }, 2000); }
    this.ambBus = null; this.ambSrcs = [];
    if (!kind) return;
    const c = this.ctx, bus = c.createGain(); bus.gain.value = 0; bus.gain.setTargetAtTime(.7, c.currentTime, 1); bus.connect(this.master);
    this.ambBus = bus;
    let next = c.currentTime + .1, step = 0;
    const each = (dur, fn) => { const tick = () => { if (next < c.currentTime) next = c.currentTime + .05; while (next < c.currentTime + 1) { fn(step, next); next += dur; step++; } }; tick(); this.ambTimers.push(setInterval(tick, 200)); };
    if (kind === "fire") {
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = this.brown; s.loop = true; f.type = "lowpass"; f.frequency.value = 350; g.gain.value = .12;
      s.connect(f); f.connect(g); g.connect(bus); s.start(); this.ambSrcs.push(s);
      each(.06, (k, t) => {
        if (Math.random() < .2) this.burst(bus, t, .02 + Math.random() * .04, .05 + Math.random() * .05, "bandpass", 1500 + Math.random() * 3000);
        if (k % 17 === 0) this.tone(bus, 1900, t, .03, "square", .006, .001);       // tích tắc
      });
    } else if (kind === "day") {
      each(.25, (k, t) => {
        if (Math.random() < .07) for (let i = 0; i < 2 + (Math.random() * 3 | 0); i++) {
          const o = c.createOscillator(), g = c.createGain(), t0 = t + i * .11, f0 = 2600 + Math.random() * 1400;
          o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f0 * 1.4, t0 + .07);
          g.gain.setValueAtTime(.0001, t0); g.gain.linearRampToValueAtTime(.025, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + .09);
          o.connect(g); g.connect(bus); o.start(t0); o.stop(t0 + .1);
        }
      });
    } else if (kind === "night") {
      each(.5, (k, t) => { if (Math.random() < .55) for (let i = 0; i < 3; i++) this.tone(bus, 4400, t + i * .06, .04, "sine", .012, .004); });
    }
  },
  // Chuông Pomodoro
  chime(phase) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, ns = phase === "break" ? [76, 79, 84] : [84, 79, 76];
    ns.forEach((n, i) => {
      this.tone(this.master, this.mtof(n), t + i * .22, 1.6, "sine", .12, .005);
      this.tone(this.master, this.mtof(n + 12), t + i * .22, .8, "sine", .03, .005);
    });
  },
  // Tiếng thú cưng
  petSound(type) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime, out = this.master;
    if (type === "cat") {
      const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
      const p = 0.9 + Math.random() * 0.25;
      o.type = "sawtooth";
      o.frequency.setValueAtTime(480 * p, t); o.frequency.linearRampToValueAtTime(880 * p, t + 0.16); o.frequency.linearRampToValueAtTime(520 * p, t + 0.5);
      f.type = "bandpass"; f.Q.value = 3;
      f.frequency.setValueAtTime(1100, t); f.frequency.linearRampToValueAtTime(2200, t + 0.16); f.frequency.linearRampToValueAtTime(900, t + 0.5);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.13, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(f); f.connect(g); g.connect(out); o.start(t); o.stop(t + 0.6);
    } else if (type === "dog") {
      for (let i = 0; i < 2; i++) {
        const t0 = t + i * 0.2, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
        o.type = "square"; o.frequency.setValueAtTime(330, t0); o.frequency.exponentialRampToValueAtTime(160, t0 + 0.12);
        f.type = "lowpass"; f.frequency.value = 1000;
        g.gain.setValueAtTime(0.13, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
        o.connect(f); f.connect(g); g.connect(out); o.start(t0); o.stop(t0 + 0.18);
      }
    } else {
      for (let i = 0; i < 2; i++) this.tone(out, 1500 + i * 400, t + i * 0.09, 0.08, "sine", 0.05, 0.005);
    }
  },

  // 🎶 Ru ngủ: nhịp 3/4 kiểu hộp nhạc
  lullaby(c, bus) {
    const chords = [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50]];
    const scale = [72, 74, 76, 79, 81, 84];
    let mi = 2;
    const arp = [0, 1, 2, 1, 2, 1];
    this.seq(0.45, (step, t) => {
      const bar = Math.floor(step / 6) % 4, s = step % 6, ch = chords[bar];
      if (s === 0) {
        this.tone(bus, this.mtof(ch[0] - 12), t, 2.6, "sine", 0.09, 0.05);
        ch.forEach(n => this.tone(bus, this.mtof(n), t, 2.7, "sine", 0.025, 0.4));
      }
      this.tone(bus, this.mtof(ch[arp[s]] + 12), t, 1.2, "triangle", 0.035);
      if (s % 2 === 0 && Math.random() < 0.8) {
        mi = Math.max(0, Math.min(scale.length - 1, mi + [-1, 0, 1, 1, -1, -2, 2][Math.floor(Math.random() * 7)]));
        const f = this.mtof(scale[mi]);
        this.tone(bus, f, t, 1.6, "sine", 0.06, 0.005);
        this.tone(bus, f * 2, t, 0.6, "sine", 0.012, 0.005);   // tiếng chuông hộp nhạc
      }
    });
  },
  // ☕ Lofi đêm
  lofi(c, bus) {
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1300; lp.connect(bus);
    const chords = [[50, 53, 57, 60], [43, 47, 50, 53], [48, 52, 55, 59], [45, 48, 52, 55]];
    this.loop(this.white, bus, 0.006, [["highpass", 3000]]);          // tiếng rè đĩa than
    this.seq(0.43, (step, t) => {
      const s = step % 8, ch = chords[Math.floor(step / 8) % 4];
      const tt = t + (s % 2 ? 0.07 : 0);                              // swing
      if (s === 0 || s === 5) ch.forEach(n => {
        this.tone(lp, this.mtof(n + 12), tt, s ? 1.2 : 3.2, "sine", 0.045, 0.01);
        this.tone(lp, this.mtof(n + 12) * 1.003, tt, s ? 1.0 : 2.8, "triangle", 0.02, 0.01);
      });
      if (s === 0) this.tone(lp, this.mtof(ch[0] - 12), tt, 1.6, "sine", 0.12);
      if (s === 0 || s === 4 || (s === 7 && Math.random() < .4)) {      // kick
        const o = c.createOscillator(), a = c.createGain();
        o.frequency.setValueAtTime(110, tt); o.frequency.exponentialRampToValueAtTime(40, tt + 0.15);
        a.gain.setValueAtTime(0.32, tt); a.gain.exponentialRampToValueAtTime(0.0001, tt + 0.3);
        o.connect(a); a.connect(bus); o.start(tt); o.stop(tt + 0.35);
      }
      if (s === 2 || s === 6) this.burst(bus, tt, 0.16, 0.07, "bandpass", 1800); // snare
      this.burst(bus, tt, 0.04, s % 2 ? 0.012 : 0.02, "highpass", 7000);         // hi-hat
    });
  },
  // 🌧️ Tiếng mưa
  rain(c, bus) {
    this.loop(this.brown, bus, 0.55, [["lowpass", 900]]);
    this.loop(this.white, bus, 0.06, [["highpass", 1800], ["lowpass", 7000]]);
    this.seq(0.08, (step, t) => {
      if (Math.random() < 0.45) this.tone(bus, 1800 + Math.random() * 2600, t + Math.random() * .08, 0.04, "sine", 0.008, 0.002);
      if (step % 250 === 120 && Math.random() < .6) {                         // sấm xa
        const s = c.createBufferSource(), f = c.createBiquadFilter(), a = c.createGain();
        s.buffer = this.brown; f.type = "lowpass"; f.frequency.value = 140;
        a.gain.setValueAtTime(0.0001, t); a.gain.linearRampToValueAtTime(0.9, t + 0.6);
        a.gain.exponentialRampToValueAtTime(0.0001, t + 4.5);
        s.connect(f); f.connect(a); a.connect(bus); s.start(t); s.stop(t + 5);
      }
    });
  },
  // 🌊 Sóng biển
  waves(c, bus) {
    const s = c.createBufferSource(); s.buffer = this.brown; s.loop = true;
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 600;
    const a = c.createGain(); a.gain.value = 0.4;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.09;
    const lg = c.createGain(); lg.gain.value = 0.35; lfo.connect(lg); lg.connect(a.gain);
    const lf = c.createGain(); lf.gain.value = 350; lfo.connect(lf); lf.connect(f.frequency);
    s.connect(f); f.connect(a); a.connect(bus); s.start(); lfo.start();
    this.srcs.push(s, lfo);
    this.loop(this.white, bus, 0.015, [["highpass", 4000]]);
    const pad = [57, 64, 69, 72];
    this.seq(8, (step, t) => pad.forEach((n, i) => this.tone(bus, this.mtof(n - 12 + (step % 2 ? 2 : 0)), t + i * .2, 9, "sine", 0.012, 2.5)));
  },
};

function ytIdFrom(s) {
  s = (s || "").trim();
  if (isYtId(s)) return s;
  try {
    const u = new URL(/^https?:/i.test(s) ? s : "https://" + s);
    const h = u.hostname.replace(/^(www|m|music)\./, "");
    let id = null;
    if (h === "youtu.be") id = u.pathname.slice(1).split("/")[0];
    else if (h.endsWith("youtube.com")) {
      id = u.searchParams.get("v");
      if (!id) { const mm = u.pathname.match(/\/(shorts|embed|live|v)\/([A-Za-z0-9_-]{11})/); if (mm) id = mm[2]; }
    }
    return isYtId(id) ? id : null;
  } catch (e) { return null; }
}

function destroyYT(slot) {
  const p = YTP[slot]; if (p) { try { p.pl.destroy(); } catch (e) {} }
  YTP[slot] = null;
}
function applyMedia(slot) {
  const m = media[slot], box = slot === "tv" ? $("#tvFrame") : $("#ytMusic");
  if (!m) {
    destroyYT(slot); box.classList.add("hidden");
    if (slot === "tv") { tvBig = false; placeTV(); }
    updateUnlock(); return;
  }
  box.classList.remove("hidden");
  if (slot === "tv") placeTV();
  if (!ytApiReady) { loadYTApi(); return; }
  let p = YTP[slot];
  if (p && p.id !== m.id) {
    if (p.ready) { p.id = m.id; p.fails = 0; p.pl.loadVideoById({videoId: m.id, startSeconds: mediaPos(m)}); }
    else { destroyYT(slot); p = null; }
  }
  if (!p) {
    const hold = $(slot === "tv" ? "#tvHold" : "#musicHold"), el = document.createElement("div");
    hold.innerHTML = ""; hold.appendChild(el);
    p = YTP[slot] = {ready: false, id: m.id, fails: 0, pl: null};
    p.pl = new YT.Player(el, {
      width: "100%", height: "100%", videoId: m.id,
      playerVars: {autoplay: 1, start: Math.floor(mediaPos(m)), playsinline: 1, controls: 0, disablekb: 1,
                   rel: 0, modestbranding: 1, fs: 0, iv_load_policy: 3, origin: location.origin},
      events: {
        onReady: () => { p.ready = true; p.pl.setVolume(Math.round(Sound.vol * 100)); syncYT(slot); },
        onStateChange: e => {
          if (e.data === 1) {
            p.fails = 0; updateUnlock();
            if (slot === "music") $("#mTitle").textContent = (p.pl.getVideoData() || {}).title || "YouTube";
          }
        },
        onError: e => toast([101, 150].includes(e.data) ? "Video này không cho phát nhúng, thử video khác nhé" : "Không phát được video này 😢"),
      },
    });
    return;
  }
  syncYT(slot);
}
function syncYT(slot) {
  const m = media[slot], p = YTP[slot];
  if (!m || !p || !p.ready || p.id !== m.id) return;
  const pl = p.pl, st = pl.getPlayerState(), want = mediaPos(m);
  const live = !!(pl.getVideoData && (pl.getVideoData() || {}).isLive), dur = pl.getDuration() || 0;
  if (!live && dur > 0 && want < dur - 1 && Math.abs(pl.getCurrentTime() - want) > 3) pl.seekTo(want, true);
  if (m.paused) { if (st === 1 || st === 3) pl.pauseVideo(); return; }
  if (st === 0) return;                                      // video đã hết
  if (st !== 1 && st !== 3) {                                // trình duyệt chặn tự phát
    pl.playVideo();
    if (++p.fails >= 2) pl.mute();
  }
  updateUnlock();
}
function updateUnlock() {
  const need = ["tv", "music"].some(s => {
    const p = YTP[s], m = media[s];
    return p && p.ready && m && !m.paused && (p.fails >= 2 || p.pl.isMuted());
  });
  $("#ytUnlock").classList.toggle("hidden", !need || !joined);
}
$("#ytUnlock").onclick = () => {
  for (const s of ["tv", "music"]) {
    const p = YTP[s]; if (!p || !p.ready || !media[s]) continue;
    p.pl.unMute(); p.pl.setVolume(Math.round(Sound.vol * 100));
    if (!media[s].paused) p.pl.playVideo();
    p.fails = 0;
  }
  $("#ytUnlock").classList.add("hidden");
};

function connect() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  ws = new WebSocket(url);
  ws.onopen = () => send({t: "join", room: roomCode, name: myName, color: myColor, pet: myPet, kind: wantKind});
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => {
    if (!joined && !wantReconnect) { $("#lobbyErr").textContent = "Không kết nối được server 😢"; return; }

  };
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function addPlayer(d) {
  const p = {...d, tx: d.x, ty: d.y, lying: false, walking: false, up: false, bubble: null, emote: null};
  if (p.pet && p.pet.type !== "none" && PETS[p.pet.type])
    p.petObj = {x: p.x - 18, y: p.y + 3, dir: 1, walking: false, sleeping: false, side: -1, jumpAt: -9, hearts: [], nameUntil: 0};
  if (p.bed != null && seatIn(p.area, p.bed)) { const s = bedSpot(p.bed, p.area); p.x = p.tx = s.x; p.y = p.ty = s.y; p.lying = true; }
  players.set(p.id, p);
  return p;
}

function handle(m) {
  switch (m.t) {
    case "welcome": {
      myId = m.id; roomCode = m.room; joined = true; wantReconnect = false;

      clockOff = m.state.now - Date.now() / 1000;
      areas = m.state.areas; pomo = m.state.pomo;

      if (m.state.pet) { setRoomPet(m.state.pet); roomPet.x = roomPet.tx; roomPet.y = roomPet.ty; }
      $("#volCtl").classList.remove("hidden");
      $("#lobby").classList.add("hidden");
      ["#top", "#hud"].forEach(s => $(s).classList.remove("hidden"));
      $("#roomCode").textContent = roomCode;
      resize();
      updateUI();
      log(`Chào <b>${esc(myName)}</b>! ` + {study: "Chạm vào bàn để ngồi học 📚, bấm 🍅 để bật Pomodoro",
        park: "Đây là công viên trung tâm 🌳. Bắc: phòng học · Tây: ký túc xá · Đông: rạp phim. Bấm 🗺️ để xem bản đồ", sleep: "Chạm vào giường để đi ngủ 🛏️",
        cinema: "Chạm màn chiếu để chọn phim 🎬, chạm ghế để ngồi xem 🍿"}[myArea]);
      if (!park()) log(`🚪 Cửa ra: ${doorsHere().map(d => AREA_NAME[d.to]).join(" · ")}`);
      if (players.size === 1) log(`🐾 Mèo <b>Mun</b> của phòng sẽ ở cùng bạn. Chạm để vuốt ve nhé!`);
      break;
    }
    case "join": addPlayer(m.p); log(`<b>${esc(m.p.name)}</b> vừa vào nhà (${AREA_NAME[m.p.area]}) 👋`); updateUI(); break;
    case "area": {
      const p = players.get(m.id); if (!p) break;
      if (p.sat_at) { p.studied = (p.studied || 0) + serverNow() - p.sat_at; p.sat_at = null; }
      const from = p.area;
      p.bed = null; p.lying = false; p.area = m.area;
      p.x = p.tx = m.x; p.y = p.ty = m.y; p.walking = false;
      if (p.petObj) { p.petObj.x = m.x + 10; p.petObj.y = m.y + 3; }
      if (m.id === myId) { setArea(m.area); log(`🚪 Bạn đã sang ${AREA_NAME[m.area]}`); }
      else if (m.area === myArea) log(`<b>${esc(p.name)}</b> vừa sang đây 🚪`);
      else if (from === myArea) log(`<b>${esc(p.name)}</b> đã sang ${AREA_NAME[m.area]} 🚪`);
      updateUI(); break;
    }
    case "leave": log(`<b>${esc(nameOf(m.id))}</b> đã rời phòng`); players.delete(m.id); updateUI(); break;
    case "move": {
      const p = players.get(m.id); if (!p) break;
      if (p.bed != null) {          // thức dậy / đứng dậy khỏi bàn
        if (p.sat_at) { p.studied = (p.studied || 0) + serverNow() - p.sat_at; p.sat_at = null; }
        const s = bedSpot(p.bed, p.area);
        p.x = s.x; p.y = standUpY(p.area, p.bed);
        p.bed = null; p.lying = false;
      }
      p.tx = m.x; p.ty = m.y; updateUI(); break;
    }
    case "sleep": {
      const p = players.get(m.id); if (!p) break;
      if (p.lying && p.bed != null) { const s = bedSpot(p.bed, p.area); p.x = s.x; p.y = standUpY(p.area, p.bed); }
      if (p.sat_at) p.studied = (p.studied || 0) + m.at - p.sat_at;
      p.sat_at = p.area === "study" ? m.at : null;
      p.bed = m.bed; p.lying = false;
      const s = bedSpot(m.bed, p.area); p.tx = s.x; p.ty = s.y;
      updateUI(); break;
    }
    case "media": {
      clockOff = m.now - Date.now() / 1000;
      const A = areas[m.area];
      A.media[m.slot] = m.media;
      if (m.slot === "tv") {
        if (m.a === "load") A.tv = {on: true, ch: -1};
        if (m.a === "stop") { A.tv.on = false; A.tvTimer = null; }
      } else if (m.a === "load") A.music.on = false;
      if (m.area !== myArea) break;

      log(`<b>${esc(m.by)}</b> ${{load: "mở YouTube", pause: "tạm dừng YouTube", play: "tiếp tục YouTube", stop: "tắt YouTube"}[m.a]} ${where}`);

      clockOff = m.now - Date.now() / 1000; pomo = m.pomo;
      if (myArea !== "study") break;                 // không làm phiền người đang ngủ
      if (m.a === "switch") {
        Sound.chime(pomo.phase);
        const msg = pomo.phase === "break" ? `☕ Hết giờ học! Nghỉ ${pomo.brk} phút nào` : `📚 Hết giờ nghỉ, vào học thôi! (hiệp ${pomo.round})`;
        toast(msg); log(msg);
      } else {
        log(`<b>${esc(m.by)}</b> ` + {start: "bắt đầu Pomodoro ▶", pause: "tạm dừng Pomodoro ⏸", reset: "đặt lại Pomodoro ↺",
          set: `đổi Pomodoro thành ${pomo.focus}/${pomo.brk} phút`}[m.a]);
      }
      break;
    }
    case "status": { const p = players.get(m.id); if (p) p.status = m.text; break; }
    case "pat": {
      const now = performance.now() / 1000;
      let pet, type, name, owner = null;
      if (m.target === "room") { pet = roomPet; type = "cat"; name = ROOM_PET.name; }
      else {
        owner = players.get(m.target); if (!owner || !owner.petObj) break;

      else if (!m.silent && m.by !== "⏰ Hẹn giờ") log(`<b>${esc(m.by)}</b> đã hủy hẹn giờ tắt TV`);

    case "tv": {

    case "light":

  wide = vw / vh > 1.15 && vw >= 480;

    const roomW = Math.min(vh * W / H, vw * 0.45);

    let tw = right - left, th = tw * 9 / 16;

}

function patternAt(kind, x, y, w, h) {
  ctx.save(); rr(ctx, x, y, w, h, 6); ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2;
  for (let yy = y + 8; yy < y + h; yy += 14) for (let xx = x + 6 + ((yy - y) / 14 % 2) * 7; xx < x + w; xx += 15) {
    ctx.beginPath();
    if (kind === "stars") { for (let k = 0; k < 5; k++) { const a = k * 2.513 - 1.57; ctx.lineTo(xx + Math.cos(a) * 3.5, yy + Math.sin(a) * 3.5); } ctx.fill(); }
    else if (kind === "clouds") { ctx.arc(xx, yy, 2.6, 0, 7); ctx.arc(xx + 3.5, yy - 1, 3, 0, 7); ctx.arc(xx + 7, yy, 2.4, 0, 7); ctx.fill(); }
    else if (kind === "moons") { ctx.fillStyle = "#ffe8a3"; ctx.arc(xx, yy, 3.5, 0, 7); ctx.fill(); ctx.fillStyle = BED_STYLE[2].c; ctx.beginPath(); ctx.arc(xx + 1.8, yy - 1, 3, 0, 7); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.55)"; }
    else if (kind === "bears") { ctx.arc(xx, yy, 3, 0, 7); ctx.arc(xx - 2.6, yy - 2.6, 1.4, 0, 7); ctx.arc(xx + 2.6, yy - 2.6, 1.4, 0, 7); ctx.fill(); }
    else if (kind === "cats") { ctx.arc(xx, yy, 3, 0, 7); ctx.moveTo(xx - 3, yy - 1); ctx.lineTo(xx - 2.5, yy - 5); ctx.lineTo(xx, yy - 2.5); ctx.lineTo(xx + 2.5, yy - 5); ctx.lineTo(xx + 3, yy - 1); ctx.fill(); }
    else if (kind === "flowers") { for (let k = 0; k < 5; k++) { const a = k * 1.256; ctx.moveTo(xx, yy); ctx.arc(xx + Math.cos(a) * 2.4, yy + Math.sin(a) * 2.4, 1.6, 0, 7); } ctx.fill(); ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(xx, yy, 1.2, 0, 7); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.55)"; }
    else if (kind === "dots") { ctx.arc(xx, yy, 2, 0, 7); ctx.fill(); }
  }
  if (kind === "stripes") for (let xx = x - h; xx < x + w; xx += 10) { ctx.beginPath(); ctx.moveTo(xx, y + h); ctx.lineTo(xx + h, y); ctx.stroke(); }

}

    const hx = walk ? 8 : 4, hy = walk ? -12 : -15;
    ctx.beginPath(); ctx.arc(hx, hy, 5, 0, 7); ctx.fill();
    if (sp === "cat") {
      ctx.beginPath(); ctx.moveTo(hx - 4.5, hy - 2); ctx.lineTo(hx - 3, hy - 9); ctx.lineTo(hx, hy - 4);
      ctx.moveTo(hx, hy - 4); ctx.lineTo(hx + 3, hy - 9); ctx.lineTo(hx + 4.5, hy - 2); ctx.fill();
      if (type !== "room") { ctx.strokeStyle = dk; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-3, -12); ctx.lineTo(-2, -8); ctx.moveTo(0, -12.5); ctx.lineTo(1, -8.5); ctx.stroke(); }
    } else if (sp === "dog") {
      ctx.fillStyle = dk; ctx.beginPath(); ctx.ellipse(hx - 3, hy + 1, 2.2, 4.5, .25, 0, 7); ctx.fill();
      ctx.fillStyle = "#2a1d16"; ctx.beginPath(); ctx.arc(hx + 5, hy + 1, 1.3, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(hx - 2, hy - 9, 1.9, 5.5, -.15, 0, 7); ctx.ellipse(hx + 1.5, hy - 9.5, 1.9, 5.5, .15, 0, 7); ctx.fill();
      ctx.fillStyle = "#f6b8c8"; ctx.beginPath(); ctx.ellipse(hx + 1.5, hy - 9.5, .8, 4, .15, 0, 7); ctx.fill();
    }
    ctx.fillStyle = eyeC; ctx.beginPath(); ctx.arc(hx + 2, hy - .5, 1.1, 0, 7); ctx.fill();
    if (sp !== "dog") { ctx.fillStyle = "#f28aa0"; ctx.fillRect(hx + 4, hy + 1, 1.3, 1.1); }
  }
  ctx.restore();
}
function petOverlay(o, name, t) {
  o.hearts = o.hearts.filter(h => t - h.t0 < 1.4);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const h of o.hearts) {
    const a = (t - h.t0) / 1.4; if (a < 0) continue;
    ctx.globalAlpha = 1 - a; ctx.font = `${10 + a * 4}px system-ui`;
    ctx.fillText("❤️", o.x + h.dx, o.y - 24 - a * 26);
  }
  ctx.globalAlpha = 1;
  if (t < o.nameUntil) label(`${name} ❤ ${o.patBy || ""}`, o.x, o.y - 36, "#ffc2d1");
  if (o.sleeping) {
    const ph = (t * .5 + (o.x % 7) / 7) % 1;
    ctx.font = `700 ${7 + ph * 4}px system-ui`; ctx.fillStyle = `rgba(200,210,255,${Math.sin(ph * Math.PI)})`;
    ctx.fillText("z", o.x + 9 + ph * 6, o.y - 12 - ph * 14);
  }
}

function drawPlayer(p, t) {
  const bob = p.walking ? Math.abs(Math.sin(t * 12)) * 2 : Math.sin(t * 2) * .4;
  const x = p.x, y = p.y;
  ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(x, y, 10, 4, 0, 0, 7); ctx.fill();
  if (p.walking) {                                       // chân
    const s = Math.sin(t * 12) * 2.5; ctx.fillStyle = "#3b2f4a";
    ctx.fillRect(x - 6, y - 5 + s * .3, 4, 5); ctx.fillRect(x + 2, y - 5 - s * .3, 4, 5);
  }
  ctx.fillStyle = p.color; rr(ctx, x - 10, y - 21 - bob, 20, 18, 7); ctx.fill();
  ctx.fillStyle = lighten(p.color, .35); ctx.beginPath(); ctx.arc(x - 4, y - 12 - bob, 1.5, 0, 7); ctx.arc(x + 4, y - 15 - bob, 1.5, 0, 7); ctx.fill();
  const hy = y - 30 - bob;
  ctx.fillStyle = "#f5d0a9"; ctx.beginPath(); ctx.arc(x, hy, 10, 0, 7); ctx.fill();
  ctx.fillStyle = "#3b2a20";
  if (p.up) { ctx.beginPath(); ctx.arc(x, hy, 10.5, 0, 7); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.arc(x, hy - 2, 10.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - 10.5, hy - 2, 3, 6); ctx.fillRect(x + 7.5, hy - 2, 3, 6);
    ctx.fillStyle = "#2a1d16"; ctx.fillRect(x - 4.5, hy + 1, 2, 2.5); ctx.fillRect(x + 2.5, hy + 1, 2, 2.5);
    ctx.fillStyle = "rgba(255,120,140,.35)"; ctx.beginPath(); ctx.arc(x - 6.5, hy + 5, 2, 0, 7); ctx.arc(x + 6.5, hy + 5, 2, 0, 7); ctx.fill();
  }
  // mũ ngủ
  ctx.fillStyle = lighten(p.color, .15); ctx.beginPath(); ctx.moveTo(x - 9, hy - 6); ctx.quadraticCurveTo(x, hy - 20, x + 13, hy - 14); ctx.lineTo(x + 9, hy - 6); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x + 13, hy - 14, 2.6, 0, 7); ctx.fill();
}

function label(text, x, y, color = "#fff") {
  ctx.font = "700 10px system-ui,-apple-system,Segoe UI,Roboto,sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(10,8,25,.85)"; ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function bubble(text, x, y) {
  ctx.font = "600 11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
  const words = text.split(" "), lines = []; let cur = "";
  for (const wd of words) { const tst = cur ? cur + " " + wd : wd; if (ctx.measureText(tst).width > 120 && cur) { lines.push(cur); cur = wd; } else cur = tst; }
  lines.push(cur);
  const lh = 14, bw = Math.min(130, Math.max(...lines.map(l => ctx.measureText(l).width))) + 14, bh = lines.length * lh + 8;
  const bx = Math.max(4, Math.min(W - bw - 4, x - bw / 2)), by = y - bh - 6;
  ctx.fillStyle = "rgba(255,255,255,.96)"; rr(ctx, bx, by, bw, bh, 9); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 5, by + bh); ctx.lineTo(x, by + bh + 6); ctx.lineTo(x + 5, by + bh); ctx.fill();
  ctx.fillStyle = "#1d1838"; ctx.textAlign = "center"; ctx.textBaseline = "top";
  lines.forEach((l, i) => ctx.fillText(l, bx + bw / 2, by + 4 + i * lh, 126));
}

function drawDarkness(t) {
  if (lightLevel < 0.01) return;
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.globalCompositeOperation = "source-over";
  dctx.clearRect(0, 0, dark.width, dark.height);
  dctx.fillStyle = `rgba(6,5,26,${0.8 * lightLevel})`; dctx.fillRect(0, 0, dark.width, dark.height);
  dctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  dctx.globalCompositeOperation = "destination-out";
  const hole = (x, y, r, a) => {
    const g = dctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, "rgba(0,0,0,0)");
    dctx.fillStyle = g; dctx.fillRect(x - r, y - r, r * 2, r * 2);
  };
  if (LAYOUT.moon) hole(LAYOUT.moon.x, LAYOUT.moon.y, 120, .55);  // ánh trăng
  const tc = tvCenter(), rc = {x: RADIO.x + 24, y: RADIO.y + 14};
  if (room.tv.on && TVR) hole(tc.x, tc.y, 260,.85 + Math.sin(t * 7) * .05 + Math.sin(t * 13) * .04);
  if (room.music.on) hole(rc.x, rc.y, 55, .45);
  if (park()) LAMPS.forEach(l => hole(l.x, l.y - 30, 95, .75));    // đèn đường
  if (myArea === "sleep") {                                         // lò sưởi + đèn ngủ từng giường
    hole(180, 140, 150, .9 + Math.sin(t * 8) * .04);
    BEDS.forEach((b, i) => hole(i % 2 ? b.x + BED_W - 14 : b.x + 14, b.y - 20, 34, .6));
  }
  if (study()) for (const p of here())                            // đèn bàn học
    if (p.lying && p.bed != null) { const b = BEDS[p.bed]; hole(b.x + 32, b.y + 32, 75, .8); }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dark, 0, 0); ctx.restore();
  if (room.tv.on && TVR) {                                        // ánh màu TV
    const c = room.tv.ch >= 0 ? TV_CH[room.tv.ch].glow : "170,180,255", tcc = tvCenter(), g = ctx.createRadialGradient(tcc.x, tcc.y, 0, tcc.x, tcc.y, 280);
    g.addColorStop(0, `rgba(${c},${.22 * lightLevel})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(-50, -200, W + 100, 700); ctx.restore();
  }
}

// ================== LOOP ==================
let lastT = performance.now() / 1000, noteAcc = 0;
function frame() {
  const t = performance.now() / 1000, dt = Math.min(.05, t - lastT); lastT = t;

  // update
  for (const p of players.values()) {
    if (p.lying) { p.walking = false; continue; }
    const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
    if (d > 1.5) {
      const s = Math.min(d, SPEED * dt);
      p.x += dx / d * s; p.y += dy / d * s; p.walking = true; p.up = dy < -Math.abs(dx) * .6;
    } else {
      p.x = p.tx; p.y = p.ty; p.walking = false; p.up = false;
      if (p.bed != null) { p.lying = true; if (p.id === myId) updateUI(); }
    }
  }
  updatePets(dt);
  if (pendingDoor) {
    const m = me();
    const d = pendingDoor;
    if (m && !m.walking && Math.hypot(m.x - d.spot.x, m.y - d.spot.y) < 3) { pendingDoor = false; send({t: "area", area: d.to}); }
  }
  const target = room.light ? 0 : 1;
  lightLevel += (target - lightLevel) * Math.min(1, dt * 2.5);
  if (room.music.on && (noteAcc += dt) > .7) {
    noteAcc = 0; notes.push({x: RADIO.x + 24 + (Math.random() - .5) * 20, y: RADIO.y - 5, t, s: ["♪", "♫", "♩"][Math.random() * 3 | 0]});
  }
  notes = notes.filter(n => t - n.t < 3);
  taps = taps.filter(tp => t - tp.t < .6);

  // draw
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0d0b1e"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, -1000, W, 3000); ctx.clip();

  drawTheater(t);
  drawRoom(t);
  BEDS.forEach((_, i) => drawBed(i, t));
  taps.forEach(tp => { const a = (t - tp.t) / .6; ctx.strokeStyle = `rgba(255,210,122,${1 - a})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(tp.x, tp.y, 4 + a * 12, 2 + a * 5, 0, 0, 7); ctx.stroke(); });
  doorsHere().forEach(d => { if (!d.custom) drawDoorAt(d, t); });
  const ents = [];                                                // vẽ theo thứ tự y
  for (const p of here()) {
    if (!p.lying) ents.push({y: p.y, f: () => drawPlayer(p, t)});
    if (p.petObj) {
      const o = p.petObj, f = () => drawPet(p.pet.type, PETS[p.pet.type].color, o, t, p.id.charCodeAt(0));
      if (o.sleeping) f(); else ents.push({y: o.y, f});
    }
  }
  const rf = () => drawPet("room", ROOM_PET.color, roomPet, t, 7);
  if (roomPet.area === myArea) { if (roomPet.sleeping) rf(); else ents.push({y: roomPet.y, f: rf}); }
  ents.sort((a, b) => a.y - b.y).forEach(e => e.f());

  drawDarkness(t);

  // top layer: notes, names, zzz, bubbles, emotes
  ctx.font = "14px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (tvTimerEnd && room.tv.on && TVR) {
    const rem = tvTimerEnd - serverNow();
    if (rem > 0) label("⏰ " + fmtTime(rem), TVR.x + TVR.w / 2, TVR.y + TVR.h + 20, "#ffd27a");
  }
  ctx.font = "14px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  notes.forEach(n => { const a = (t - n.t) / 3; ctx.fillStyle = `rgba(255,210,122,${1 - a})`; ctx.fillText(n.s, n.x + Math.sin(a * 8) * 6, n.y - a * 50); });

  for (const p of here()) if (p.petObj) petOverlay(p.petObj, p.pet.name, t);
  if (roomPet.area === myArea) petOverlay(roomPet, ROOM_PET.name, t);
  for (const d of doorsHere()) {
    const txt = d.side === "right" ? `${AREA_NAME[d.to]} →` : d.side === "left" ? `← ${AREA_NAME[d.to]}` : d.side === "bottom" ? `↓ ${AREA_NAME[d.to]}` : `↑ ${AREA_NAME[d.to]}`;
    const lx = d.side === "right" ? d.x - 24 : d.side === "left" ? d.x + 50 : d.x + d.w / 2;
    const ly = d.custom && d.side !== "wall" ? d.y - 12 : d.y - 9;
    label(txt, Math.max(52, Math.min(W - 52, lx)), ly, "#ffe2a8");
  }
  if (park() && lightLevel > .05) drawFireflies(t);
  if (myArea === "sleep") drawFairyLights(t);
  if (cinema()) drawCinemaFX(t);

  for (const p of here()) {
    let hx, hy;
    if (p.lying) {
      const b = BEDS[p.bed]; hx = b.x + BED_W / 2; hy = b.y + 6;
      label(p.name + (study() && p.status ? " · " + p.status : ""), hx, b.y - 7, p.id === myId ? "#ffd27a" : "#fff");
      for (let k = 0; k < (myArea === "sleep" ? 3 : 0); k++) {
        const ph = (t * .45 + k / 3 + p.bed * .13) % 1;
        ctx.font = `700 ${9 + ph * 8}px system-ui`; ctx.fillStyle = `rgba(200,210,255,${Math.sin(ph * Math.PI)})`;
        ctx.fillText("z", b.x + 80 + ph * 14 + Math.sin(ph * 6) * 3, b.y + 14 - ph * 30);
      }
    } else {
      hx = p.x; hy = p.y - 48;
      label(p.name, p.x, p.y - 51, p.id === myId ? "#ffd27a" : "#fff");
    }
    if (p.emote && t < p.emote.until) {
      const a = Math.min(1, (t - p.emote.at) * 5);
      ctx.font = `${16 + a * 8}px system-ui`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.globalAlpha = Math.min(1, (p.emote.until - t) * 2);
      ctx.fillText(p.emote.e, hx + 22, hy - 4 - a * 6);
      ctx.globalAlpha = 1;
    }
    if (p.bubble && t < p.bubble.until) bubble(p.bubble.text, hx, hy - 6);
  }
  ctx.restore();

  // vignette khi mình đang ngủ
  const m = me();
  if (m && m.lying && myArea === "sleep") {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const g = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.height * .25, canvas.width / 2, canvas.height / 2, canvas.height * .75);
    g.addColorStop(0, "rgba(0,0,10,0)"); g.addColorStop(1, `rgba(0,0,10,${.45 + Math.sin(t * .8) * .05})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // banner ngủ cùng nhau
  if (joined) {
    const ar = myArea, all = here(), n = all.length;
    const allSleep = n > 0 && all.every(p => p.lying) && (ar !== "sleep" || !room.light);
    if (allSleep) {
      if (togetherSince == null) togetherSince = t;
      $("#together").classList.remove("hidden");
      $("#togetherText").textContent = {
        study: n > 1 ? `📚 Cả ${n} người đang học cùng nhau` : "📚 Đang tập trung học",
        park: n > 1 ? `🌳 Cả ${n} người đang ngồi ngắm trời cùng nhau` : "🌳 Đang ngồi thư giãn",
        cinema: n > 1 ? `🍿 Cả ${n} người đang xem phim cùng nhau` : "🍿 Đang xem phim",
        sleep: n > 1 ? `🌙 Cả ${n} người đang ngủ cùng nhau` : "🌙 Đang ngủ ngon"}[ar];
      $("#togetherTime").textContent = fmtTime(t - togetherSince);
    } else if (togetherSince != null) { togetherSince = null; $("#together").classList.add("hidden"); }
  }
  updatePill();
  requestAnimationFrame(frame);
}

// ================== LOBBY ==================
(function lobby() {
  const params = new URLSearchParams(location.search);
  $("#nameInput").value = localStorage.getItem("nc_name") || "";
  $("#roomInput").value = (params.get("room") || "").toUpperCase();
  myColor = localStorage.getItem("nc_color") || COLORS[Math.random() * COLORS.length | 0];
  const box = $("#colors");
  COLORS.forEach(c => {
    const b = document.createElement("button"); b.style.background = c; if (c === myColor) b.classList.add("sel");
    b.onclick = () => { myColor = c; box.querySelectorAll("button").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); };
    box.appendChild(b);
  });
  myPet.type = PETS[localStorage.getItem("nc_pet")] ? localStorage.getItem("nc_pet") : "cat";
  $("#petName").value = localStorage.getItem("nc_petname") || "";
  const pbox = $("#pets");
  const setPet = k => {
    myPet.type = k;
    pbox.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x.dataset.k === k));
    $("#petName").classList.toggle("hidden", k === "none");
    if (k !== "none") $("#petName").placeholder = `Tên thú cưng (mặc định: ${PETS[k].def})`;
  };
  Object.entries(PETS).forEach(([k, v]) => {
    const b = document.createElement("button"); b.dataset.k = k;
    b.innerHTML = `${v.e}<span>${v.label}</span>`; b.onclick = () => setPet(k);
    pbox.appendChild(b);
  });
  setPet(myPet.type);
  const go = code => {
    myName = $("#nameInput").value.trim();
    myPet.name = $("#petName").value.trim();
    localStorage.setItem("nc_pet", myPet.type); localStorage.setItem("nc_petname", myPet.name);
    if (!myName) { $("#lobbyErr").textContent = "Nhập tên trước đã nha!"; $("#nameInput").focus(); return; }
    roomCode = code.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    if (!roomCode) { $("#lobbyErr").textContent = "Nhập mã phòng hoặc tạo phòng mới"; return; }
    localStorage.setItem("nc_name", myName); localStorage.setItem("nc_color", myColor);
    $("#lobbyErr").textContent = "Đang vào phòng…";
    Sound.ensure();                // mở khoá âm thanh trong lúc người dùng bấm
    connect();
  };
  $("#joinBtn").onclick = () => { wantKind = ["study", "sleep", "cinema"].includes(params.get("area")) ? params.get("area") : "park"; go($("#roomInput").value); };
  const newRoom = kind => {
    const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = "";
    for (let i = 0; i < 5; i++) s += A[Math.random() * A.length | 0];
    wantKind = kind; $("#roomInput").value = s; go(s);
  };
  $("#newBtn").onclick = () => newRoom("park");
  $("#roomInput").addEventListener("keydown", e => { if (e.key === "Enter") $("#joinBtn").click(); });
})();

resize();
requestAnimationFrame(frame);
</script>
</body>
