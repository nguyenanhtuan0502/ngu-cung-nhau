<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg_sintel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e76f51"/>
      <stop offset="60%" stop-color="#e76f51" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="card_sintel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </linearGradient>
    <filter id="shadow_sintel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" rx="16" fill="url(#bg_sintel)"/>

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="276" height="426" rx="12" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Top Header: Genre Tag & Blender Open Movie -->
  <g transform="translate(24, 24)">
    <rect width="70" height="22" rx="11" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">PHIÊU LƯU</text>
  </g>
  <text x="276" y="39" text-anchor="end" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2">BLENDER OPEN MOVIE</text>

  <!-- Art Scene -->
  <g id="art" filter="url(#shadow_sintel)">
    <!-- Rising Sun and Mountains -->
    <circle cx="150" cy="190" r="80" fill="#f4a261" opacity="0.3"/>
    <polygon points="30,285 110,180 180,285" fill="#264653" opacity="0.7"/>
    <polygon points="120,285 200,165 280,285" fill="#1d3557" opacity="0.8"/>
    <polygon points="80,295 160,205 240,295" fill="#2a9d8f" opacity="0.6"/>
    <ellipse cx="150" cy="295" rx="130" ry="35" fill="#1b263b"/>
    <!-- Sintel Silhouette & Bravery -->
    <g transform="translate(90, 175)">
      <!-- Cape / Coat -->
      <path d="M 15 45 Q 5 80 -10 110 L 40 110 Q 30 75 25 45 Z" fill="#9d0208"/>
      <!-- Body -->
      <path d="M 12 40 L 28 40 L 32 90 L 10 90 Z" fill="#6a040f"/>
      <!-- Head and Windswept Hair -->
      <circle cx="20" cy="25" r="13" fill="#f8edeb"/>
      <path d="M 10 25 Q -10 22 -15 32 Q 5 36 15 32 Z" fill="#ffd166"/>
      <path d="M 8 18 Q 20 8 32 20 Q 15 15 10 25 Z" fill="#e76f51"/>
      <!-- Bandana -->
      <rect x="9" y="18" width="22" height="4" rx="2" fill="#f39c12"/>
      <!-- Extended Arm -->
      <path d="M 26 48 Q 50 42 62 38" fill="none" stroke="#f8edeb" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Baby Dragon Scales -->
    <g transform="translate(195, 185) scale(0.95)">
      <!-- Dragon Body -->
      <ellipse cx="0" cy="15" rx="16" ry="12" fill="#52b788"/>
      <path d="M 10 18 Q 25 24 30 16 Q 26 10 14 14" fill="#52b788"/>
      <!-- Dragon Wings -->
      <path d="M -2 8 Q 12 -18 22 -10 Q 14 -2 5 10 Z" fill="#74c69d"/>
      <path d="M -8 10 Q -20 -15 -10 -8 Q -6 0 -2 12 Z" fill="#40916c"/>
      <!-- Head & Horns -->
      <circle cx="-12" cy="5" r="10" fill="#52b788"/>
      <polygon points="-8,-2 -6,-8 -3,-2" fill="#d8f3dc"/>
      <circle cx="-15" cy="4" r="3.5" fill="#ffd166"/>
      <circle cx="-16" cy="4" r="1.5" fill="#1b4332"/>
      <!-- Tiny Fire Puff Spark -->
      <circle cx="-26" cy="6" r="3" fill="#ffba08"/>
      <circle cx="-32" cy="7" r="1.5" fill="#e85d04"/>
    </g>
  </g>

  <!-- Bottom Title Box -->
  <rect x="16" y="340" width="268" height="90" rx="10" fill="url(#card_sintel)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <text x="150" y="382" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="0.8">Sintel</text>
  <text x="150" y="408" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">Cô gái đi khắp thế giới tìm lại chú rồng nhỏ của mình</text>
</svg>