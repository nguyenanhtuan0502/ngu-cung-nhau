<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg_charge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="60%" stop-color="#e63946" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="card_charge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </linearGradient>
    <filter id="shadow_charge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" rx="16" fill="url(#bg_charge)"/>

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="276" height="426" rx="12" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Top Header: Genre Tag & Blender Open Movie -->
  <g transform="translate(24, 24)">
    <rect width="70" height="22" rx="11" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">HÀNH ĐỘNG</text>
  </g>
  <text x="276" y="39" text-anchor="end" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2">BLENDER OPEN MOVIE</text>

  <!-- Art Scene -->
  <g id="art" filter="url(#shadow_charge)">
    <!-- Dynamic Perspective Speed Lines -->
    <line x1="150" y1="180" x2="20" y2="90" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="150" y1="180" x2="280" y2="90" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="150" y1="180" x2="10" y2="280" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
    <line x1="150" y1="180" x2="290" y2="280" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
    <!-- Dystopian Neon Grid -->
    <polygon points="80,290 150,230 220,290" fill="#590d22" opacity="0.6"/>
    <!-- Glowing Battery / Power Core -->
    <g transform="translate(150, 180)">
      <!-- Outer Core Glow -->
      <circle cx="0" cy="0" r="60" fill="#00f5d4" opacity="0.2"/>
      <circle cx="0" cy="0" r="40" fill="#00b4d8" opacity="0.3"/>
      <!-- Battery Capsule Shell -->
      <rect x="-24" y="-38" width="48" height="76" rx="12" fill="#1b263b" stroke="#e0e1dd" stroke-width="3"/>
      <!-- Battery Terminal -->
      <rect x="-10" y="-45" width="20" height="8" rx="2" fill="#e0e1dd"/>
      <!-- Glowing Energy Fluid -->
      <rect x="-18" y="-30" width="36" height="60" rx="8" fill="#00f5d4"/>
      <!-- Electric Lightning Bolts Inside -->
      <polygon points="-4,-20 6,-8 0,-6 6,15 -6,2 0,0" fill="#ffffff"/>
      <!-- Energy Level Rings -->
      <line x1="-18" y1="-12" x2="18" y2="-12" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      <line x1="-18" y1="6" x2="18" y2="6" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    </g>
    <!-- Leaping Cyborg Pursuer Silhouette -->
    <g transform="translate(100, 210) scale(0.9)">
      <!-- Head -->
      <circle cx="0" cy="0" r="8" fill="#03045e"/>
      <rect x="2" y="-3" width="7" height="3" fill="#00f5d4"/>
      <!-- Dynamic Limbs -->
      <line x1="0" y1="8" x2="-15" y2="35" stroke="#03045e" stroke-width="5" stroke-linecap="round"/>
      <line x1="-15" y1="35" x2="-30" y2="45" stroke="#03045e" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="0" y1="8" x2="15" y2="30" stroke="#03045e" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="12" x2="25" y2="-10" stroke="#03045e" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <!-- Warning Hologram Hexagons -->
    <polygon points="230,120 245,112 260,120 260,136 245,144 230,136" fill="none" stroke="#ffd166" stroke-width="1.5" opacity="0.8"/>
    <text x="245" y="131" text-anchor="middle" fill="#ffd166" font-family="monospace" font-size="7" font-weight="700">ALERT</text>
  </g>

  <!-- Bottom Title Box -->
  <rect x="16" y="340" width="268" height="90" rx="10" fill="url(#card_charge)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <text x="150" y="382" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="0.8">Charge</text>
  <text x="150" y="408" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">Cuộc rượt đuổi giành giật nguồn năng lượng tương lai</text>
</svg>