<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg_hero" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="60%" stop-color="#f72585" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="card_hero" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </linearGradient>
    <filter id="shadow_hero" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" rx="16" fill="url(#bg_hero)"/>

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="276" height="426" rx="12" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Top Header: Genre Tag & Blender Open Movie -->
  <g transform="translate(24, 24)">
    <rect width="70" height="22" rx="11" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">HÀNH ĐỘNG</text>
  </g>
  <text x="276" y="39" text-anchor="end" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2">BLENDER OPEN MOVIE</text>

  <!-- Art Scene -->
  <g id="art" filter="url(#shadow_hero)">
    <!-- Dynamic Sketchbook Ink Strokes & Hatches -->
    <path d="M 40 140 L 90 125" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <path d="M 35 155 L 85 140" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
    <path d="M 210 110 L 260 95" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <path d="M 215 125 L 265 110" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
    <!-- Slash Arc Light Streak -->
    <path d="M 60 250 Q 150 80 250 200" fill="none" stroke="#4cc9f0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 250 Q 150 80 250 200" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hero Warrior Leaping -->
    <g transform="translate(150, 185)">
      <!-- Giant Drafting Pencil Blade -->
      <g transform="rotate(-35 0 0)">
        <!-- Hexagonal Pencil Body -->
        <rect x="-6" y="-85" width="12" height="100" fill="#ffd166" stroke="#d4a373" stroke-width="1"/>
        <!-- Sharpened Wood Cone -->
        <polygon points="-6,-85 6,-85 0,-105" fill="#fcd5ce"/>
        <!-- Graphite Tip -->
        <polygon points="-2.5,-97 2.5,-97 0,-105" fill="#212529"/>
        <!-- Eraser Cap at bottom -->
        <rect x="-6" y="15" width="12" height="10" rx="2" fill="#ff758f"/>
        <rect x="-6.5" y="11" width="13" height="4" fill="#ced4da"/>
      </g>
      <!-- Flowing Heroic Pink/Red Scarf -->
      <path d="M -8 -8 C -40 -15 -60 10 -90 5 C -65 25 -40 10 -8 5 Z" fill="#ff0054"/>
      <!-- Hero Body Silhouette -->
      <circle cx="0" cy="-18" r="9" fill="#10002b"/>
      <!-- Spiky Manga Hair -->
      <polygon points="-6,-24 0,-32 4,-24" fill="#10002b"/>
      <polygon points="2,-24 8,-30 8,-20" fill="#10002b"/>
      <!-- Torso & Cloak -->
      <path d="M -8 -9 L 8 -9 L 14 25 L -10 25 Z" fill="#240046"/>
      <!-- Limbs in Mid-Air Action Pose -->
      <line x1="-8" y1="20" x2="-25" y2="45" stroke="#10002b" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="8" y1="20" x2="25" y2="38" stroke="#10002b" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="-5" y1="-5" x2="-22" y2="-25" stroke="#10002b" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- Graphite Dust & Spark Particles -->
    <circle cx="110" cy="130" r="3" fill="#4cc9f0"/>
    <circle cx="210" cy="140" r="2.5" fill="#ffd166"/>
    <circle cx="180" cy="100" r="2" fill="#ffffff"/>
    <circle cx="90" cy="220" r="2" fill="#ff0054"/>
  </g>

  <!-- Bottom Title Box -->
  <rect x="16" y="340" width="268" height="90" rx="10" fill="url(#card_hero)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <text x="150" y="382" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="0.8">Hero</text>
  <text x="150" y="408" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">Cuộc phiêu lưu vẽ tay bằng bút chì 2D kỳ ảo</text>
</svg>