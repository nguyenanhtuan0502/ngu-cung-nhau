<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg_coffeerun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9c6644"/>
      <stop offset="60%" stop-color="#9c6644" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="card_coffeerun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </linearGradient>
    <filter id="shadow_coffeerun" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" rx="16" fill="url(#bg_coffeerun)"/>

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="276" height="426" rx="12" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Top Header: Genre Tag & Blender Open Movie -->
  <g transform="translate(24, 24)">
    <rect width="70" height="22" rx="11" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">NGẮN</text>
  </g>
  <text x="276" y="39" text-anchor="end" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2">BLENDER OPEN MOVIE</text>

  <!-- Art Scene -->
  <g id="art" filter="url(#shadow_coffeerun)">
    <!-- Warm Amber Cafe Glow -->
    <circle cx="150" cy="210" r="85" fill="#ddb892" opacity="0.25"/>
    <circle cx="150" cy="210" r="55" fill="#b08968" opacity="0.2"/>
    <!-- Floating Coffee Beans -->
    <g transform="translate(65, 150) rotate(-25)">
      <ellipse cx="0" cy="0" rx="10" ry="7" fill="#4a2810"/>
      <path d="M -8 0 Q 0 4 8 0" fill="none" stroke="#2b1704" stroke-width="1.8"/>
    </g>
    <g transform="translate(235, 160) rotate(35)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="#4a2810"/>
      <path d="M -7 0 Q 0 3 7 0" fill="none" stroke="#2b1704" stroke-width="1.8"/>
    </g>
    <g transform="translate(210, 260) rotate(15)">
      <ellipse cx="0" cy="0" rx="8" ry="5.5" fill="#4a2810"/>
      <path d="M -6 0 Q 0 3 6 0" fill="none" stroke="#2b1704" stroke-width="1.5"/>
    </g>
    <!-- Steaming Coffee Cup on Saucer -->
    <!-- Saucer -->
    <ellipse cx="150" cy="280" rx="65" ry="14" fill="#ede0d4"/>
    <ellipse cx="150" cy="278" rx="55" ry="10" fill="#e6ccb2"/>
    <!-- Cup -->
    <path d="M 110 220 L 120 268 C 124 275 176 275 180 268 L 190 220 Z" fill="#ede0d4"/>
    <ellipse cx="150" cy="220" rx="40" ry="12" fill="#ede0d4"/>
    <ellipse cx="150" cy="220" rx="36" ry="10" fill="#6f4e37"/>
    <!-- Heart Latte Art -->
    <path d="M 150 223 C 150 218 143 216 140 219 C 137 222 144 226 150 228 C 156 226 163 222 160 219 C 157 216 150 218 150 223 Z" fill="#faedcd"/>
    <!-- Cup Handle -->
    <path d="M 186 230 C 208 230 208 255 180 258" fill="none" stroke="#ede0d4" stroke-width="8" stroke-linecap="round"/>
    <!-- Swirling Steam Forming Dreamscape & Runner -->
    <path d="M 142 205 Q 120 170 145 145 T 155 105" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M 158 205 Q 180 165 160 140 T 145 95" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Tiny Dream Runner Silhouette -->
    <g transform="translate(150, 115) scale(0.85)">
      <circle cx="0" cy="-14" r="5" fill="#fdf0d5"/>
      <line x1="0" y1="-9" x2="-2" y2="4" stroke="#fdf0d5" stroke-width="3" stroke-linecap="round"/>
      <line x1="-2" y1="-4" x2="8" y2="-1" stroke="#fdf0d5" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-2" y1="-4" x2="-10" y2="-6" stroke="#fdf0d5" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-2" y1="4" x2="6" y2="15" stroke="#fdf0d5" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-2" y1="4" x2="-8" y2="12" stroke="#fdf0d5" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Bottom Title Box -->
  <rect x="16" y="340" width="268" height="90" rx="10" fill="url(#card_coffeerun)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <text x="150" y="382" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="0.8">Coffee Run</text>
  <text x="150" y="408" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">Một cốc cà phê và cả chuyến đi kỳ thú trong tâm trí</text>
</svg>