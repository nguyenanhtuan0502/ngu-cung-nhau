<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg_spring" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90be6d"/>
      <stop offset="60%" stop-color="#90be6d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="card_spring" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </linearGradient>
    <filter id="shadow_spring" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" rx="16" fill="url(#bg_spring)"/>

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="276" height="426" rx="12" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Top Header: Genre Tag & Blender Open Movie -->
  <g transform="translate(24, 24)">
    <rect width="70" height="22" rx="11" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">THẦN THOẠI</text>
  </g>
  <text x="276" y="39" text-anchor="end" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2">BLENDER OPEN MOVIE</text>

  <!-- Art Scene -->
  <g id="art" filter="url(#shadow_spring)">
    <!-- Ancient Mossy Rocks & Mountain Spire -->
    <polygon points="50,290 120,170 180,290" fill="#2d6a4f" opacity="0.6"/>
    <polygon points="130,300 210,150 280,300" fill="#1b4332" opacity="0.8"/>
    <ellipse cx="150" cy="295" rx="125" ry="30" fill="#132a13"/>
    <!-- Glowing Spiral Spring Spirits -->
    <circle cx="150" cy="165" r="75" fill="#b7e4c7" opacity="0.15"/>
    <path d="M 80 130 Q 90 110 110 115 T 120 135" fill="none" stroke="#d8f3dc" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 220 120 Q 200 100 180 110 T 175 130" fill="none" stroke="#d8f3dc" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Shepherd Girl with Hooded Cloak -->
    <g transform="translate(100, 160)">
      <!-- Cloak Body -->
      <path d="M 25 50 L 10 125 L 45 125 L 35 50 Z" fill="#2b4162"/>
      <!-- Hood -->
      <path d="M 25 15 C 8 15 10 45 25 48 C 40 45 42 15 25 15 Z" fill="#1d2d44"/>
      <!-- Face in Shadow -->
      <ellipse cx="25" cy="32" rx="9" ry="11" fill="#fed9b7"/>
      <!-- Cute Eyes -->
      <circle cx="28" cy="32" r="1.8" fill="#1d2d44"/>
      <!-- Staff with Glowing Turquoise Orb -->
      <line x1="45" y1="20" x2="42" y2="128" stroke="#7f4f24" stroke-width="3" stroke-linecap="round"/>
      <path d="M 45 22 Q 48 10 40 10 Q 34 10 38 20" fill="none" stroke="#7f4f24" stroke-width="3"/>
      <circle cx="41" cy="14" r="8" fill="#52b788" opacity="0.5"/>
      <circle cx="41" cy="14" r="5" fill="#a7c957"/>
      <circle cx="41" cy="14" r="2.5" fill="#ffffff"/>
    </g>
    <!-- Shaggy Mountain Sheepdog Autumn -->
    <g transform="translate(160, 220)">
      <!-- Fluffy Body -->
      <ellipse cx="25" cy="38" rx="22" ry="16" fill="#f8f9fa"/>
      <circle cx="40" cy="28" r="14" fill="#f8f9fa"/>
      <!-- Ears & Face Fringe -->
      <ellipse cx="44" cy="20" rx="5" ry="10" fill="#dee2e6" transform="rotate(25 44 20)"/>
      <ellipse cx="32" cy="20" rx="5" ry="10" fill="#dee2e6" transform="rotate(-15 32 20)"/>
      <!-- Nose & Eye -->
      <circle cx="46" cy="30" r="3" fill="#212529"/>
      <circle cx="40" cy="25" r="2" fill="#212529"/>
      <!-- Legs -->
      <rect x="12" y="48" width="6" height="15" rx="3" fill="#e9ecef"/>
      <rect x="28" y="48" width="6" height="15" rx="3" fill="#e9ecef"/>
      <!-- Fluffy Tail -->
      <ellipse cx="4" cy="30" rx="7" ry="5" fill="#f8f9fa" transform="rotate(-30 4 30)"/>
    </g>
    <!-- Glowing Spores -->
    <circle cx="75" cy="220" r="3" fill="#e9d8a6" opacity="0.8"/>
    <circle cx="230" cy="190" r="2.5" fill="#e9d8a6" opacity="0.8"/>
    <circle cx="150" cy="120" r="3.5" fill="#e9d8a6" opacity="0.7"/>
  </g>

  <!-- Bottom Title Box -->
  <rect x="16" y="340" width="268" height="90" rx="10" fill="url(#card_spring)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <text x="150" y="382" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="0.8">Spring</text>
  <text x="150" y="408" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">Cô bé chăn cừu và chú chó đón mùa xuân thức giấc</text>
</svg>