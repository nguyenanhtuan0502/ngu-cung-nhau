<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg_cosmos" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a9d8f"/>
      <stop offset="60%" stop-color="#2a9d8f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="card_cosmos" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </linearGradient>
    <filter id="shadow_cosmos" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" rx="16" fill="url(#bg_cosmos)"/>

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="276" height="426" rx="12" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Top Header: Genre Tag & Blender Open Movie -->
  <g transform="translate(24, 24)">
    <rect width="70" height="22" rx="11" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">KỲ ẢO</text>
  </g>
  <text x="276" y="39" text-anchor="end" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2">BLENDER OPEN MOVIE</text>

  <!-- Art Scene -->
  <g id="art" filter="url(#shadow_cosmos)">
    <!-- Cosmic Nebula Whirlpool Background -->
    <ellipse cx="150" cy="190" r="95" ry="75" fill="#7209b7" opacity="0.3" transform="rotate(-20 150 190)"/>
    <ellipse cx="150" cy="190" r="75" ry="55" fill="#f72585" opacity="0.25" transform="rotate(25 150 190)"/>
    <!-- Twinkling Stars -->
    <circle cx="70" cy="120" r="2" fill="#fff"/>
    <circle cx="230" cy="110" r="1.8" fill="#fff"/>
    <circle cx="85" cy="240" r="1.5" fill="#fff"/>
    <circle cx="235" cy="250" r="2.2" fill="#fff"/>
    <!-- Lonely Cliff Mound -->
    <polygon points="20,310 140,280 280,310" fill="#1b4332"/>
    <ellipse cx="150" cy="295" rx="120" ry="20" fill="#0d1f18"/>
    <!-- Washing Machine Standing in the Field -->
    <g transform="translate(140, 145)">
      <!-- Machine Box -->
      <rect x="0" y="0" width="70" height="95" rx="8" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
      <!-- Top Control Panel -->
      <rect x="6" y="6" width="58" height="15" rx="3" fill="#ced4da"/>
      <circle cx="20" cy="13.5" r="4.5" fill="#495057"/>
      <circle cx="34" cy="13.5" r="2" fill="#06d6a0"/>
      <circle cx="42" cy="13.5" r="2" fill="#ef476f"/>
      <!-- Round Washer Door Opening to Portal -->
      <circle cx="35" cy="55" r="26" fill="#10002b" stroke="#6c757d" stroke-width="4"/>
      <!-- Swirling Galaxy Inside -->
      <circle cx="35" cy="55" r="22" fill="#3a0ca3"/>
      <path d="M 22 55 Q 35 38 48 55 T 35 68" fill="none" stroke="#4cc9f0" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="35" cy="55" r="4" fill="#ffd166"/>
      <circle cx="43" cy="46" r="2" fill="#f72585"/>
      <circle cx="26" cy="62" r="1.5" fill="#4cc9f0"/>
    </g>
    <!-- Franck the Melancholic Curly Sheep -->
    <g transform="translate(70, 195)">
      <!-- Legs -->
      <rect x="18" y="55" width="4" height="22" rx="2" fill="#212529"/>
      <rect x="36" y="55" width="4" height="22" rx="2" fill="#212529"/>
      <!-- Fluffy Body -->
      <ellipse cx="30" cy="38" rx="24" ry="20" fill="#f8f9fa"/>
      <circle cx="16" cy="32" r="10" fill="#e9ecef"/>
      <circle cx="28" cy="24" r="11" fill="#f8f9fa"/>
      <circle cx="42" cy="30" r="10" fill="#e9ecef"/>
      <circle cx="36" cy="46" r="10" fill="#f8f9fa"/>
      <!-- Head -->
      <ellipse cx="50" cy="32" rx="10" ry="12" fill="#343a40"/>
      <!-- Curly Horn -->
      <path d="M 46 24 Q 40 14 50 14 Q 58 16 52 24" fill="none" stroke="#e9c46a" stroke-width="3" stroke-linecap="round"/>
      <!-- Sad Eye -->
      <circle cx="53" cy="30" r="2" fill="#ffffff"/><circle cx="54" cy="30" r="1" fill="#000"/>
    </g>
  </g>

  <!-- Bottom Title Box -->
  <rect x="16" y="340" width="268" height="90" rx="10" fill="url(#card_cosmos)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <text x="150" y="382" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.8">Cosmos Laundromat</text>
  <text x="150" y="408" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">Chú cừu Franck chán đời và tiệm giặt đa vũ trụ</text>
</svg>