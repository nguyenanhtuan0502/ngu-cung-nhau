<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg_cami" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9c46a"/>
      <stop offset="60%" stop-color="#e9c46a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="card_cami" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </linearGradient>
    <filter id="shadow_cami" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" rx="16" fill="url(#bg_cami)"/>

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="276" height="426" rx="12" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Top Header: Genre Tag & Blender Open Movie -->
  <g transform="translate(24, 24)">
    <rect width="70" height="22" rx="11" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">HÀI</text>
  </g>
  <text x="276" y="39" text-anchor="end" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2">BLENDER OPEN MOVIE</text>

  <!-- Art Scene -->
  <g id="art" filter="url(#shadow_cami)">
    <!-- Patagonian Desert Road & Mountains -->
    <polygon points="30,280 110,185 190,280" fill="#bc6c25" opacity="0.5"/>
    <polygon points="120,280 200,175 280,280" fill="#99582a" opacity="0.6"/>
    <ellipse cx="150" cy="285" rx="125" ry="30" fill="#6f1d1b"/>
    <!-- Blazing Desert Sun -->
    <circle cx="225" cy="115" r="30" fill="#ffb703" opacity="0.6"/>
    <circle cx="225" cy="115" r="20" fill="#fff3b0"/>
    <!-- Wooden Fence with Barbed Wire -->
    <!-- Posts -->
    <rect x="75" y="180" width="10" height="105" rx="2" fill="#7f4f24"/>
    <rect x="215" y="180" width="10" height="105" rx="2" fill="#7f4f24"/>
    <!-- Barbed Wire Strands -->
    <line x1="40" y1="205" x2="260" y2="205" stroke="#adb5bd" stroke-width="2"/>
    <line x1="40" y1="240" x2="260" y2="240" stroke="#adb5bd" stroke-width="2"/>
    <!-- Barb crosses -->
    <line x1="130" y1="201" x2="136" y2="209" stroke="#6c757d" stroke-width="2"/>
    <line x1="136" y1="201" x2="130" y2="209" stroke="#6c757d" stroke-width="2"/>
    <line x1="165" y1="236" x2="171" y2="244" stroke="#6c757d" stroke-width="2"/>
    <line x1="171" y1="236" x2="165" y2="244" stroke="#6c757d" stroke-width="2"/>
    <!-- Koro the Llama / Guanaco with ridiculously long neck -->
    <g transform="translate(50, 160)">
      <!-- Fluffy Body -->
      <ellipse cx="40" cy="85" rx="28" ry="20" fill="#dda15e"/>
      <rect x="25" y="100" width="5" height="25" rx="2" fill="#bc6c25"/>
      <rect x="45" y="100" width="5" height="25" rx="2" fill="#bc6c25"/>
      <ellipse cx="15" cy="78" rx="6" ry="5" fill="#dda15e"/>
      <!-- Long Neck Weaving Over the Wire -->
      <path d="M 55 75 C 65 30 90 20 115 25 C 130 28 140 50 155 75" fill="none" stroke="#dda15e" stroke-width="14" stroke-linecap="round"/>
      <!-- Head reaching down toward grass -->
      <ellipse cx="160" cy="82" rx="12" ry="9" fill="#dda15e"/>
      <!-- Big Goofy Round Eyes -->
      <circle cx="158" cy="76" r="6" fill="#ffffff" stroke="#212529" stroke-width="1"/>
      <circle cx="160" cy="76" r="2.5" fill="#212529"/>
      <!-- Floppy Ears -->
      <ellipse cx="150" cy="72" rx="4" ry="9" fill="#bc6c25" transform="rotate(-30 150 72)"/>
      <ellipse cx="154" cy="70" rx="4" ry="9" fill="#bc6c25" transform="rotate(-10 154 70)"/>
    </g>
    <!-- Tiny Juicy Dandelion on the other side of the fence -->
    <g transform="translate(216, 258)">
      <path d="M 0 15 Q -5 5 0 0" fill="none" stroke="#52b788" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="4" fill="#ffd166"/>
      <ellipse cx="-4" cy="10" rx="5" ry="2" fill="#52b788" transform="rotate(-25 -4 10)"/>
    </g>
  </g>

  <!-- Bottom Title Box -->
  <rect x="16" y="340" width="268" height="90" rx="10" fill="url(#card_cami)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <text x="150" y="382" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="0.8">Caminandes 2</text>
  <text x="150" y="408" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">Chú lạc đà Koro và cuộc chiến vượt rào ăn cỏ</text>
</svg>